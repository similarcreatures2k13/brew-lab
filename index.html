<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Lab">
<meta name="theme-color" content="#0d0a08">
<title>Brew Lab V3.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0d0a08;
    --bg-shell: #1a1612;
    --bg-raised: #241d18;
    --bg-deepest: #050403;
    --line-faint: #2a221c;
    --line-strong: #4a3a2c;
    --text-primary: #f0e6dc;
    --text-muted: #8a7a6a;
    --text-ghost: #4a3a2c;
    --gold: #c8956c;
    --gold-glow: #e5b380;
    --gold-deep: #8a6240;
    --amber: #d4742a;
    --green-lock: #6b8e5a;
    --red-miss: #8e5a5a;
    --blue-cool: #5a7a8e;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ui: 'Inter Tight', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--ui);
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; border-radius: 0; }
  input, textarea, select {
    font-family: inherit;
    background: var(--bg-shell);
    color: var(--text-primary);
    border: 1px solid var(--line-strong);
    padding: 12px;
    font-size: 15px;
    width: 100%;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
  textarea { resize: vertical; min-height: 80px; }

  /* ── CRT SCANLINE OVERLAY (body.crt) ────────────── */
  body.crt::before {
    content: "";
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── BOOT OVERLAY ───────────────────────────────── */
  .boot-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-deepest);
    z-index: 9000;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 28px;
    cursor: pointer;
    transition: opacity 0.3s ease-out;
  }
  .boot-overlay.fade-out { opacity: 0; pointer-events: none; }
  .boot-inner { width: 100%; max-width: 480px; }
  .boot-lines { font-family: var(--mono); font-size: 13px; color: var(--text-muted); line-height: 1.9; }
  .boot-line {
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.18s ease-out, transform 0.18s ease-out;
    white-space: pre;
  }
  .boot-line.on { opacity: 1; transform: translateY(0); }
  .boot-line.title { color: var(--amber); font-size: 16px; font-weight: 700; letter-spacing: 0.06em; }
  .boot-line.dim { color: var(--text-ghost); }
  .boot-skip {
    margin-top: 28px;
    font-family: var(--mono); font-size: 9px;
    color: var(--text-ghost); letter-spacing: 0.18em;
    text-transform: uppercase; text-align: center;
    animation: pulse 2s ease-in-out infinite;
  }

  /* ── TARGET ACQUIRED OVERLAY ────────────────────── */
  .acquired-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5,4,3,0.96);
    z-index: 8000;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 28px;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .acquired-inner { text-align: center; }
  .acquired-eyebrow {
    font-family: var(--mono); font-size: 12px;
    color: var(--green-lock); letter-spacing: 0.3em;
    margin-bottom: 18px;
  }
  .acquired-title {
    font-family: var(--mono); font-size: 30px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--green-lock);
    margin-bottom: 22px;
  }
  .acquired-data {
    font-family: var(--mono); font-size: 15px;
    color: var(--text-primary); letter-spacing: 0.08em;
    line-height: 2; margin-bottom: 20px;
  }
  .acquired-data span { color: var(--gold-glow); }
  .acquired-status {
    font-family: var(--mono); font-size: 10px;
    color: var(--green-lock); letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ── HUD BAR ────────────────────────────────────── */
  .hud-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg-deepest);
    border-bottom: 2px solid var(--line-strong);
    display: flex; align-items: stretch;
    padding-top: env(safe-area-inset-top);
    min-height: calc(52px + env(safe-area-inset-top));
  }
  .hud-bar.locked { border-bottom-color: var(--green-lock); }
  .hud-cell {
    display: flex; flex-direction: column; justify-content: center;
    padding: 8px 10px;
    border-right: 1px solid var(--line-faint);
    overflow: hidden; flex-shrink: 0;
  }
  .hud-cell:last-child { border-right: none; }
  .hud-cell.brand {
    min-width: 72px;
    border-right: 2px solid var(--line-strong);
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .hud-cell.brand:active { background: var(--bg-raised); }
  .hud-cell.hc-bean { flex: 1; min-width: 0; }
  .hud-cell.hc-sys { width: 82px; }
  .hud-cell.hc-status { width: 84px; }
  .hud-label {
    font-family: var(--mono); font-size: 7px;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-ghost); margin-bottom: 3px; line-height: 1;
  }
  .hud-value {
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-primary); line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud-value.brand-name {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--amber);
  }
  .hud-ver {
    font-family: var(--mono); font-size: 7px;
    color: var(--text-ghost); letter-spacing: 0.06em; line-height: 1; margin-top: 3px;
  }
  .hud-value.sv-active { color: var(--amber); }
  .hud-value.sv-locked { color: var(--green-lock); }
  .hud-value.sv-nav { color: var(--text-muted); }
  .hud-value.sv-hidden { color: var(--text-ghost); font-size: 10px; }

  /* ── SECTIONS ───────────────────────────────────── */
  .section { padding: 12px 16px; }
  .section h2 {
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .section h2::before { content: "▸"; color: var(--gold); flex-shrink: 0; }

  /* ── CARDS ──────────────────────────────────────── */
  .card {
    position: relative;
    border: 1px solid var(--line-faint);
    background: var(--bg-shell);
    padding: 18px 16px 16px;
    margin-bottom: 12px;
  }
  .card.dashed { border-style: dashed; }
  .card.ai-success { border-color: var(--gold-deep); }
  .card.ai-error { border-color: var(--red-miss); }
  .card-label {
    position: absolute; top: -7px; left: 12px;
    background: var(--bg-void); padding: 0 8px;
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted);
  }
  .card-label.gold { color: var(--gold); }
  .card-label.red { color: var(--red-miss); }
  .card.locked { border-color: var(--green-lock); }
  .card.locked .card-label { color: var(--green-lock); }
  .lock-marker {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.15em; color: var(--green-lock);
  }
  .lock-marker::before { content: "◆ "; }

  /* ── MISSION BRIEFING ───────────────────────────── */
  .mission-brief {
    border: 1px solid var(--line-faint);
    border-top: 2px solid var(--gold-deep);
    background: var(--bg-deepest);
    padding: 10px 12px;
  }
  .mb-section { padding-bottom: 0; }
  .mb-line {
    display: flex; gap: 10px; padding: 3px 0;
    font-family: var(--mono); font-size: 10px;
  }
  .mb-key {
    color: var(--text-ghost); letter-spacing: 0.12em;
    text-transform: uppercase; width: 72px; flex-shrink: 0;
  }
  .mb-val { color: var(--text-muted); line-height: 1.5; }

  /* ── BEAN DISPLAY ───────────────────────────────── */
  .bean-name { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .bean-meta {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .bean-meta .sep { color: var(--text-ghost); margin: 0 6px; }
  .bean-meta .roast-intent { color: var(--gold); font-weight: 500; }
  .bean-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .note-chip {
    font-family: var(--mono); font-size: 10px; padding: 4px 8px;
    border: 1px solid var(--line-strong);
    color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase;
  }
  .note-chip.achieved { color: var(--green-lock); border-color: var(--green-lock); }
  .note-chip.missed { color: var(--red-miss); border-color: var(--red-miss); }

  /* ── DATA GRID ──────────────────────────────────── */
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; border-top: 1px solid var(--line-faint); }
  .data-cell { padding: 12px; border-bottom: 1px solid var(--line-faint); }
  .data-cell:nth-child(odd) { border-right: 1px solid var(--line-faint); }
  .data-cell:last-child, .data-cell:nth-last-child(2):nth-child(odd) { border-bottom: none; }
  .data-cell .label {
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin-bottom: 4px;
  }
  .data-cell .value { font-family: var(--mono); font-size: 18px; font-weight: 500; }
  .data-cell .value.large { font-size: 24px; font-weight: 600; }
  .data-cell .value .unit { font-size: 11px; color: var(--text-muted); margin-left: 3px; }

  /* ── POUR TIMELINE ──────────────────────────────── */
  .pour-timeline { margin-top: 6px; }
  .pour-step {
    display: grid; grid-template-columns: 60px 1fr;
    gap: 14px; padding: 12px 0;
    border-bottom: 1px solid var(--line-faint);
    position: relative;
  }
  .pour-step:last-child { border-bottom: none; }
  .pour-step::before {
    content: ""; position: absolute;
    left: 50px; top: 0; bottom: 0; width: 1px; background: var(--line-strong);
  }
  .pour-step::after {
    content: ""; position: absolute;
    left: 47px; top: 16px; width: 7px; height: 7px;
    border: 1px solid var(--gold); background: var(--bg-shell); transform: rotate(45deg);
  }
  .pour-step .time { font-family: var(--mono); font-size: 12px; color: var(--gold); font-weight: 500; }
  .pour-step .weight { font-family: var(--mono); font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .pour-step .instr { font-size: 12px; color: var(--text-muted); }

  /* ── BUTTONS ────────────────────────────────────── */
  .btn {
    min-height: 48px; padding: 12px 16px;
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--text-primary);
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.1em;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; width: 100%;
  }
  .btn:active { background: var(--bg-raised); }
  .btn.primary { border-color: var(--gold); color: var(--gold); }
  .btn.primary:active { background: var(--gold); color: var(--bg-void); }
  .btn.danger { border-color: var(--red-miss); color: var(--red-miss); }
  .btn.ghost { border-color: var(--line-faint); color: var(--text-muted); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn-row.three { grid-template-columns: repeat(3, 1fr); }
  .btn-stack > .btn { margin-bottom: 8px; }
  .btn-stack > .btn:last-child { margin-bottom: 0; }

  /* Protocol-select buttons */
  .btn.protocol {
    height: 82px; flex-direction: column; align-items: flex-start;
    justify-content: center; gap: 5px; padding: 14px 18px;
    border-color: var(--line-strong); background: var(--bg-shell); position: relative; overflow: hidden;
  }
  .btn.protocol::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber);
  }
  .btn.protocol:active { border-color: var(--amber); background: var(--bg-raised); }
  .proto-name { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-primary); text-align: left; }
  .proto-sub { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 0.12em; color: var(--text-muted); text-align: left; }

  /* Method-select buttons */
  .btn.method-btn {
    height: 72px; flex-direction: column; align-items: flex-start;
    justify-content: center; gap: 4px; padding: 12px 16px;
    border-color: var(--line-strong); background: var(--bg-shell); position: relative; overflow: hidden;
  }
  .btn.method-btn::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold-deep);
  }
  .btn.method-btn:active { border-color: var(--gold); background: var(--bg-raised); }
  .method-name { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--gold); text-align: left; }
  .method-sub { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 0.1em; color: var(--text-muted); text-align: left; }

  /* ── CHIPS ──────────────────────────────────────── */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 14px; border: 1px solid var(--line-faint); background: var(--bg-shell);
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
  }
  .chip::before { content: "◇"; color: var(--text-ghost); }
  .chip.selected { border-color: var(--gold); color: var(--gold); background: var(--bg-raised); }
  .chip.selected::before { content: "◆"; color: var(--gold); }
  .chip.perfect {
    border-color: var(--green-lock); color: var(--green-lock);
    width: 100%; justify-content: center;
    background: rgba(107,142,90,0.07); letter-spacing: 0.12em;
  }
  /* suppress the ◇ pseudo-element for perfect chip — label has its own ◆ */
  .chip.perfect::before { content: ""; display: none; }

  /* ── FEEDBACK GRID ──────────────────────────────── */
  .feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .feedback-grid .chip { padding: 12px 10px; text-align: left; justify-content: flex-start; }
  .feedback-grid .chip.perfect { grid-column: 1 / -1; }

  /* ── BEAN GRID ──────────────────────────────────── */
  .bean-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .bean-grid .card { padding: 14px 14px 12px; cursor: pointer; transition: border-color 0.12s ease; }
  .bean-grid .card:active { border-color: var(--gold); }
  .bean-grid .card.custom .card-label::after { content: " · CUSTOM"; color: var(--gold-deep); }

  /* ── ARCHIVE STATUS (bean picker) ───────────────── */
  .archive-status {
    margin: 10px 0 4px; padding: 10px 12px;
    font-family: var(--mono); font-size: 9px;
    color: var(--text-ghost); letter-spacing: 0.1em;
    border: 1px solid var(--line-faint); background: var(--bg-deepest);
    line-height: 2;
  }

  /* ── OPERATOR LOADOUT BOX (home screen) ─────────── */
  .loadout-box {
    margin-bottom: 16px; padding: 10px 12px;
    border: 1px solid var(--line-faint); background: var(--bg-deepest);
    font-family: var(--mono); font-size: 10px;
  }
  .loadout-box .lb-header {
    color: var(--amber); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .lb-row { display: flex; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--line-faint); }
  .lb-row:last-child { border-bottom: none; }
  .lb-key { color: var(--text-ghost); letter-spacing: 0.1em; text-transform: uppercase; width: 64px; flex-shrink: 0; }
  .lb-val { color: var(--text-muted); }

  /* ── ADJUSTMENT PREVIEW ─────────────────────────── */
  .adjustment {
    margin-top: 14px; padding: 12px; border-left: 2px solid var(--gold);
    background: var(--bg-deepest); font-family: var(--mono); font-size: 12px;
  }
  .adjustment.chan { border-left-color: var(--red-miss); }
  .adjustment.ai-adj { border-left-color: var(--gold-glow); }
  .adjustment .head {
    color: var(--gold); text-transform: uppercase;
    letter-spacing: 0.1em; font-size: 10px; margin-bottom: 6px;
  }
  .adjustment.chan .head { color: var(--red-miss); }
  .adjustment.ai-adj .head { color: var(--gold-glow); }
  .adjustment .change { line-height: 1.7; }
  .arrow { color: var(--text-ghost); margin: 0 6px; }
  .new { color: var(--gold-glow); }
  .adjustment .why { color: var(--text-muted); margin-top: 8px; font-size: 11px; font-family: var(--ui); line-height: 1.5; }

  /* ── FIELD NOTE ─────────────────────────────────── */
  .dev-note-toggle {
    margin-top: 12px; font-family: var(--mono); font-size: 10px;
    color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: none; padding: 6px 0;
  }
  .dev-note-toggle::before { content: "[+ "; color: var(--text-ghost); }
  .dev-note-toggle::after { content: " ]"; color: var(--text-ghost); }
  .dev-note-toggle.open::before { content: "[− "; }
  .dev-note-area { margin-top: 8px; display: none; }
  .dev-note-area.open { display: block; }
  .dev-note-area textarea { background: var(--bg-deepest); border-color: var(--line-faint); font-family: var(--mono); font-size: 12px; }

  /* ── FORM ───────────────────────────────────────── */
  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block; margin-bottom: 6px;
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);
  }
  .three-toggle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line-strong); }
  .three-toggle button {
    background: transparent; border: none; padding: 12px 4px;
    color: var(--text-muted); font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em; border-right: 1px solid var(--line-strong);
  }
  .three-toggle button:last-child { border-right: none; }
  .three-toggle button.selected { background: var(--bg-raised); color: var(--gold); }
  .helper-text { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

  /* ── TAB BAR — hardware channel selector ────────── */
  .tab-bar {
    position: sticky; bottom: 0;
    background: var(--bg-deepest);
    border-top: 2px solid var(--line-strong);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    padding: 13px 0 11px; text-align: center;
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted); border: none; background: transparent;
    border-top: 2px solid transparent;
  }
  .tab.active { color: var(--amber); border-top-color: var(--amber); }

  /* ── SETTINGS OPTIONS PANEL ─────────────────────── */
  .options-header {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); padding: 18px 0 10px;
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 14px;
  }
  .options-header:first-child { padding-top: 4px; }
  .options-header.danger { color: var(--red-miss); border-bottom-color: var(--red-miss); }
  .options-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line-faint);
    font-family: var(--mono); font-size: 11px;
  }
  .options-row:last-child { border-bottom: none; }
  .options-key { color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .option-toggle {
    background: none; border: 1px solid var(--line-strong);
    padding: 8px 14px; min-height: 40px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted);
  }
  .option-toggle.on { border-color: var(--green-lock); color: var(--green-lock); }

<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

<script>
"use strict";

// ==========================================================
// DATA: Origin Profiles
// ==========================================================
const ORIGIN_DENSITY = {
  Kenya: 0.85, Colombia: 0.75, Ethiopia: 0.70, Guatemala: 0.70,
  "Costa Rica": 0.70, "El Salvador": 0.65, Rwanda: 0.65, Burundi: 0.65,
  Honduras: 0.60, Mexico: 0.60, Peru: 0.60, Brazil: 0.50,
  India: 0.45, Indonesia: 0.40, Sumatra: 0.35, Malaysia: 0.30,
  Vietnam: 0.30, PNG: 0.55, "Papua New Guinea": 0.55
};
const PROCESS_SOLUBILITY = {
  Washed: 0.40, Honey: 0.55, Natural: 0.70,
  Cofermentation: 0.75, Anaerobic: 0.80, "Wet-hulled": 0.65, Experimental: 0.75
};
const FRUITY_ORIGINS = ["Kenya", "Ethiopia", "Burundi", "Rwanda"];
const CHOCOLATE_ORIGINS = ["Brazil", "Mexico", "Peru", "Honduras"];

function weightedOriginProfile(origins) {
  if (!origins || origins.length === 0) {
    return { density: 0.6, solubility: 0.5, fruity: false, chocolate: false, delicate: false };
  }
  const total = origins.reduce((s, o) => s + (o.share || 0), 0) || 1;
  let density = 0, solubility = 0;
  let fruity = false, chocolate = false, delicate = false;
  for (const o of origins) {
    const w = (o.share || 0) / total;
    density += w * (ORIGIN_DENSITY[o.country] ?? 0.6);
    solubility += w * (PROCESS_SOLUBILITY[o.process] ?? 0.5);
    if (FRUITY_ORIGINS.includes(o.country)) fruity = true;
    if (CHOCOLATE_ORIGINS.includes(o.country)) chocolate = true;
    if (o.process === "Cofermentation" || o.process === "Anaerobic") delicate = true;
  }
  return { density, solubility, fruity, chocolate, delicate };
}

// ==========================================================
// ENGINE: Smart Defaults
// ==========================================================
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function smartDefaultsV60(bean, brewType) {
  const { roast = {}, tastingNotes = [], origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 24, temp = 92, pourStyle = "layered";
  const reasons = [], signals = [];

  if (profile.density > 0.7) { clicks -= 2; temp += 1; reasons.push("dense origin → finer + warmer"); signals.push("dense"); }
  if (profile.density < 0.4) { clicks += 2; temp -= 1; pourStyle = "even"; reasons.push("porous origin → coarser + cooler"); signals.push("porous"); }
  if (profile.fruity) { clicks -= 1; temp -= 1; pourStyle = "descending"; reasons.push("fruity origin → descending pour, gentle temp"); signals.push("fruity"); }
  if (profile.chocolate && !profile.fruity) { temp += 1; pourStyle = pourStyle === "layered" ? "even" : pourStyle; reasons.push("chocolate-leaning → integration pour"); signals.push("chocolate"); }
  if (profile.delicate) { clicks += 2; temp -= 1; if (pourStyle === "layered") pourStyle = "descending"; reasons.push("delicate/porous process → coarser + cooler"); signals.push("delicate"); }
  if (origins.some(o => o.process === "Wet-hulled")) { clicks += 1; reasons.push("wet-hulled → +1 click for porosity"); signals.push("wet-hulled"); }
  if (origins.some(o => /liberica/i.test(o.variety || ""))) { clicks -= 2; temp -= 1; pourStyle = "even"; reasons.push("liberica species → counter-balance porous"); signals.push("liberica"); }

  if (roast.intent === "Espresso") {
    clicks += 2; temp -= 1; pourStyle = "even";
    reasons.push("espresso roast → more soluble, coarser + cooler, integrate");
    signals.push("espresso");
  }

  if (/dark/i.test(roast.level || "")) { clicks += 1; temp -= 1; reasons.push("dark roast → coarser, cooler"); }
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") { temp += 1; reasons.push("light filter → develop with heat"); }

  if (brewType === "iced") {
    if (signals.includes("fruity") || signals.includes("delicate")) { clicks += 1; reasons.push("iced + fragile → +1 click"); }
    if (pourStyle === "layered") pourStyle = "descending";
  }

  const fragile = /jasmine|lemongrass|osmanthus|bergamot|elderflower|peach|lychee/i;
  if (tastingNotes.some(n => fragile.test(n))) { temp = Math.min(temp, 91); reasons.push("fragile aromatics → cap temp at 91°C"); }

  let confidence = "medium";
  if (signals.length >= 3) confidence = "high";
  if (origins.length >= 3) confidence = "low";
  if (!roast.intent || roast.intent === "Omni") { if (confidence === "high") confidence = "medium"; }

  return { clicks: clamp(clicks, 12, 26), temp: clamp(temp, 88, 96), pourStyle, ratio: 15, locked: false, confidence, reasons, signals };
}

function smartDefaultsBrikka(bean) {
  const { roast = {}, origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 13, baseWaterTemp = "boiling";
  let icedStyle = "straight";
  let hybridHotMl = 70;
  const reasons = [];
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") {
    clicks = 14; baseWaterTemp = "95C-cool-30s"; icedStyle = "hybrid"; hybridHotMl = 100;
    reasons.push("light filter → finer + cooler base, hybrid iced style");
  }
  if (profile.density < 0.4) { clicks = 14; reasons.push("porous → finer"); }
  if (origins.some(o => /sarchimor|parainema|catimor/i.test(o.variety || ""))) { clicks = 13; reasons.push("robusta heritage variety → standard"); }
  return { clicks, baseWaterTemp, drinkStyle: "neat", icedStyle, hybridHotMl, locked: false, confidence: "high", reasons };
}

// ==========================================================
// ENGINE: Pour Schedules
// ==========================================================
function roundTo(n, step = 5) { return Math.round(n / step) * step; }
function pourCount(dose) { if (dose <= 12) return 3; if (dose <= 18) return 4; return 5; }
function bloomG(dose) { return roundTo(dose * 2.5, 5); }

function buildLayered(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = bloomG(dose);
  const pours = pourCount(dose);
  const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.4, 0.35, 0.25] : [0.32, 0.28, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5);
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "Concentric circles, center-out." : "Continue. Thin steady stream." });
    t += pours <= 3 ? 30 : 25;
  });
  const last = steps[steps.length - 1];
  last.add += total - last.running; last.running = total;
  return { steps, total, drawdown: t + 30, iced };
}
function buildDescending(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = roundTo(dose * (iced ? 2.5 : 3), 5);
  const pours = pourCount(dose);
  const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.42, 0.32, 0.26] : [0.34, 0.26, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: iced ? "Bloom. Gentle spiral, swirl. Bloom is smaller for iced." : "Big bloom. Spiral, swirl firmly." }];
  let running = bloom, t = 50;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5);
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pour. Wide spiral, fruit-forward." : i === weights.length - 1 ? "Finishing pour. Thin stream, hold the center." : "Tighter spiral, slow flow." });
    t += 30;
  });
  const last = steps[steps.length - 1];
  last.add += total - last.running; last.running = total;
  return { steps, total, drawdown: t + 30, iced };
}
function buildEven(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = bloomG(dose);
  const pours = pourCount(dose);
  const remaining = total - bloom;
  const each = roundTo(remaining / (pours - 1), 5);
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  for (let i = 0; i < pours - 1; i++) {
    const add = i === pours - 2 ? total - running : each;
    running += add;
    steps.push({ t, add, running, instr: `Equal pour ${i + 1}. Steady concentric pour.` });
    t += 25;
  }
  return { steps, total, drawdown: t + 30, iced };
}
function buildCustomEven(dose, ratio, iced, pulseG = 26) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const count = Math.ceil(total / pulseG);
  const each = roundTo(total / count, 5);
  const steps = [];
  let running = 0, t = 0;
  for (let i = 0; i < count; i++) {
    const add = i === count - 1 ? total - running : each;
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pulse. Saturate fully." : `Pulse ${i + 1}. Same volume, same rhythm.` });
    t += 25;
  }
  return { steps, total, drawdown: t + 30, iced };
}
function generatePourSchedule(dose, ratio, pourStyle, iced = false) {
  switch (pourStyle) {
    case "descending": return buildDescending(dose, ratio, iced);
    case "even": return buildEven(dose, ratio, iced);
    case "custom_even": return buildCustomEven(dose, ratio, iced);
    default: return buildLayered(dose, ratio, iced);
  }
}
function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

// ==========================================================
// ENGINE: Feedback
// ==========================================================
const FEEDBACK_RULES_V60 = {
  sour:           { clicks: -1, temp: +1, note: "Underextracted — finer + warmer" },
  bitter:         { clicks: +1, temp: -1, note: "Overextracted — coarser + cooler" },
  acrid:          { clicks: +1, temp: -1, note: "Harsh overextraction — coarser + cooler" },
  thin:           { clicks: -1, temp:  0, note: "Underextracted body — finer" },
  "too-acidic":   { clicks:  0, temp: +1, note: "Need more sweetness — bump temp" },
  "flat-muddy":   { clicks: +1, temp:  0, note: "Muddied flavors — coarser" },
  "missing-notes":{ clicks: -1, temp: +1, note: "Under-extracted aromatics — finer + warmer" }
};
const FEEDBACK_RULES_BRIKKA = {
  sour:           { clicks: -1, note: "Underextracted — finer grind, ensure boiling water start" },
  bitter:         { clicks: +1, note: "Overextracted — coarser, pull off at first sputter" },
  acrid:          { clicks: +1, note: "Harsh overextraction — coarser, lower heat or pull off sooner" },
  thin:           { clicks: -1, note: "Underextracted body — finer, or check basket is level-full" },
  "too-acidic":   { clicks: +1, note: "Brikka can't add heat — coarsen 1 click for sweeter pull, or extend brew slightly" },
  "flat-muddy":   { clicks: +1, note: "Pulled too long — coarser, pull at first sputter not full sputter" },
  "missing-notes":{ clicks: -1, note: "Aromatics need more contact — finer grind, ensure no channelling" }
};
const CHANNELING_PAIRS = [["sour", "bitter"], ["sour", "acrid"]];
const FEEDBACK_OPTIONS = [
  { id: "sour",          label: "Sour" },
  { id: "bitter",        label: "Bitter" },
  { id: "acrid",         label: "Acrid" },
  { id: "thin",          label: "Thin" },
  { id: "too-acidic",    label: "Too acidic" },
  { id: "flat-muddy",    label: "Flat / muddy" },
  { id: "missing-notes", label: "Missing notes" }
];

function processFeedback({ currentRecipe, feedback, recipeKey }) {
  const isBrikka = recipeKey && recipeKey.startsWith("brikka");
  const rules = isBrikka ? FEEDBACK_RULES_BRIKKA : FEEDBACK_RULES_V60;
  const maxClicks = isBrikka ? 15 : 26;
  const minClicks = 12;

  for (const [a, b] of CHANNELING_PAIRS) {
    if (feedback.includes(a) && feedback.includes(b)) {
      return {
        type: "channeling",
        diagnosis: isBrikka
          ? "Sour + bitter on Brikka = channeling. Coffee bed isn't sealing — level grounds (no tamping), check basket isn't overfilled, ensure top half is screwed firm."
          : "Sour + bitter together = channeling. Bed prep issue, not grind or temp.",
        action: isBrikka
          ? "Same clicks. Re-pour at level fill, no tamping, swirl basket gently before assembly."
          : "Try: wet WDT, level bed, slower bloom. Same settings.",
        adjustment: null
      };
    }
  }

  let clicksDelta = 0, tempDelta = 0;
  const reasons = [];
  for (const f of feedback) {
    const rule = rules[f];
    if (!rule) continue;
    clicksDelta += rule.clicks;
    if (!isBrikka) tempDelta += rule.temp || 0;
    reasons.push(rule.note);
  }

  if (clicksDelta === 0 && (isBrikka || tempDelta === 0)) {
    return { type: "no-change", diagnosis: "Feedback signals cancel. No clear direction.", action: "Re-brew same settings, focus technique.", adjustment: null };
  }

  clicksDelta = clamp(clicksDelta, isBrikka ? -1 : -2, isBrikka ? 1 : 2);
  tempDelta = clamp(tempDelta, -2, 2);

  const adjustment = {
    clicks: clamp(currentRecipe.clicks + clicksDelta, minClicks, maxClicks),
    temp: (!isBrikka && currentRecipe.temp) ? clamp(currentRecipe.temp + tempDelta, 88, 96) : null
  };
  return { type: "adjustment", diagnosis: reasons.join(". "), adjustment, delta: { clicks: clicksDelta, temp: tempDelta } };
}

// ==========================================================
// ENGINE: AI Advisor
// ==========================================================
const EQUIPMENT_BLOCK = `EQUIPMENT:
- Hand grinder: Commandante C40 (click range 12-26, finer = lower number, default 24)
- Filter brewer: Hario V60 (paper filter)
- Pressure brewer: Bialetti Brikka 4-cup moka pot
- Heat source: Infrared burner at 1600W
- Kettle: Temperature-controlled, Celsius only`;

const AI_ROLES = {
  fill:   `ROLE: New bean, no dial-in yet. Generate a starting recipe. Be conservative — user will dial from here. Aim for the gentler/safer end. If espresso roast, it is MORE soluble on V60 — coarser + cooler than filter roast.`,
  adjust: `ROLE: Current recipe is not landing after multiple brews. Diagnose pattern and propose a shift. Treat current values as anchor — adjust, do not replace. Maximum 2 clicks and 2°C from current.`,
  review: `ROLE: Sanity check on current recipe. If it looks correct, say so with high confidence and propose minimal/no changes.`
};

function buildAIPrompt({ bean, recipeKey, currentRecipe, feedbackHistory = [], mode }) {
  const beanCtx = `BEAN:
Name: ${bean.name}
Roaster: ${bean.roaster || "Unknown"}
Roast level: ${bean.roast?.level || "Unknown"}
Roast intent: ${bean.roast?.intent || "Filter"}${bean.roast?.intent === "Espresso" ? "  (espresso roast — more soluble on V60, coarser + cooler than filter roasts)" : ""}
Origins:
${bean.origins.map(o => `  - ${o.country} ${o.variety || ""} ${o.process || ""} (${o.share}%)`).join("\n")}
Tasting notes: ${bean.tastingNotes?.join(", ") || "—"}`;

  const currentCtx = currentRecipe ?
`CURRENT RECIPE (your anchor):
Slot: ${recipeKey}
- Clicks: ${currentRecipe.clicks}
- Temp: ${currentRecipe.temp || "—"}°C
- Pour style: ${currentRecipe.pourStyle || "—"}
- Ratio: 1:${currentRecipe.ratio || 15}
- Locked: ${currentRecipe.locked ? "yes" : "no"}` : `NO CURRENT RECIPE. Generate from scratch.`;

  const feedbackCtx = feedbackHistory.length ?
`RECENT BREWS (most recent last):
${feedbackHistory.slice(-3).map((h, i) => `  ${i + 1}. ${h.settings.clicks} clicks, ${h.settings.temp}°C → ${h.feedback.join(", ")}`).join("\n")}` : "";

  return `${EQUIPMENT_BLOCK}

${beanCtx}

${currentCtx}

${feedbackCtx}

${AI_ROLES[mode]}

${recipeKey && recipeKey.startsWith("brikka") ? `
OUTPUT — return ONLY this JSON object for a BRIKKA MOKA POT recipe. No preamble, no markdown, no commentary.

{"clicks": INT_12_TO_15, "temp": null, "pourStyle": "even", "ratio": null, "rationale": "STRING max 50 words", "confidence": "high" OR "medium" OR "low"}

HARD RULES (BRIKKA):
1. Click numbers only between 12 and 15. No text grind descriptions.
2. temp, ratio, pourStyle are NOT used for Brikka — set temp=null, ratio=null, pourStyle="even".
3. ${mode === "adjust" ? "ADJUST MODE: " : ""}Stay within 1 click of current recipe.${currentRecipe ? ` Current is ${currentRecipe.clicks} clicks — your output must be in [${Math.max(12, currentRecipe.clicks - 1)}, ${Math.min(15, currentRecipe.clicks + 1)}].` : ""}
4. Brikka extraction is short and aggressive (1.5 bar, ~6 min). Finer = sweeter, more body. Coarser = brighter, less bitter.
` : `
OUTPUT — return ONLY this JSON object for a V60 POUR-OVER recipe. No preamble, no markdown, no commentary.

{"clicks": INT_12_TO_26, "temp": INT_88_TO_96, "pourStyle": "layered" OR "descending" OR "even" OR "custom_even", "ratio": INT_14_TO_17, "rationale": "STRING max 50 words", "confidence": "high" OR "medium" OR "low"}

HARD RULES (V60):
1. Click numbers only. Never text grind descriptions ("medium-fine" is forbidden).
2. ${mode === "adjust" ? "ADJUST MODE: " : ""}Stay within 2 clicks and 2°C of current recipe.${currentRecipe ? ` Current is ${currentRecipe.clicks} clicks, ${currentRecipe.temp}°C — your output must be in [${Math.max(12, currentRecipe.clicks - 2)}, ${Math.min(26, currentRecipe.clicks + 2)}] clicks and [${Math.max(88, (currentRecipe.temp || 92) - 2)}, ${Math.min(96, (currentRecipe.temp || 92) + 2)}]°C.` : ""}
3. ratio must be an integer (14, 15, 16, or 17) — NOT a string like "1:15".
4. Espresso roast on V60 needs COARSER and COOLER than filter roast. Counterintuitive but critical.
`}`;
}

function parseAIResponse(text, recipeKey) {
  let cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{"); const end = cleaned.lastIndexOf("}");
  if (start >= 0 && end > start) cleaned = cleaned.slice(start, end + 1);
  try {
    const p = JSON.parse(cleaned);
    const isBrikka = recipeKey && recipeKey.startsWith("brikka");
    if (typeof p.ratio === "string") { const m = p.ratio.match(/(\d+)\s*$/); if (m) p.ratio = parseInt(m[1]); }
    if (typeof p.clicks === "string") p.clicks = parseInt(p.clicks);
    if (typeof p.temp === "string") p.temp = parseInt(p.temp);
    const minClicks = isBrikka ? 11 : 12; const maxClicks = isBrikka ? 16 : 26;
    if (typeof p.clicks !== "number" || isNaN(p.clicks) || p.clicks < minClicks || p.clicks > maxClicks) throw new Error(`clicks out of range: ${p.clicks}`);
    if (!isBrikka) {
      if (typeof p.temp !== "number" || isNaN(p.temp) || p.temp < 88 || p.temp > 96) throw new Error(`temp out of range: ${p.temp}`);
      if (!["layered","descending","even","custom_even"].includes(p.pourStyle)) throw new Error(`bad pourStyle: ${p.pourStyle}`);
      if (typeof p.ratio !== "number" || isNaN(p.ratio) || p.ratio < 14 || p.ratio > 17) throw new Error(`ratio out of range: ${p.ratio}`);
    } else {
      if (typeof p.temp !== "number" || isNaN(p.temp)) p.temp = null;
      if (typeof p.ratio !== "number" || isNaN(p.ratio)) p.ratio = null;
      if (!["layered","descending","even","custom_even"].includes(p.pourStyle)) p.pourStyle = null;
    }
    if (!["high","medium","low"].includes(p.confidence)) p.confidence = "medium";
    if (typeof p.rationale !== "string") p.rationale = "";
    return { ok: true, ...p };
  } catch (e) {
    return { ok: false, error: e.message, raw: text };
  }
}

async function askAdvisor({ bean, recipeKey, currentRecipe, feedbackHistory, mode, apiKey }) {
  if (!apiKey) return { ok: false, error: "No API key set. Add one in Settings." };
  if (!bean) return { ok: false, error: "No bean provided." };
  if (!["fill","adjust","review"].includes(mode)) return { ok: false, error: `Bad mode: ${mode}` };
  const prompt = buildAIPrompt({ bean, recipeKey, currentRecipe, feedbackHistory, mode });
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 400,
        messages: [
          { role: "user", content: prompt },
          { role: "assistant", content: "{" }
        ]
      })
    });
    if (!response.ok) { const err = await response.text(); return { ok: false, error: `API ${response.status}: ${err.slice(0, 200)}` }; }
    const data = await response.json();
    const text = data.content?.[0]?.text || "";
    return parseAIResponse("{" + text, recipeKey);
  } catch (e) {
    return { ok: false, error: `Network error: ${e.message}` };
  }
}

  const existing = bean.recipes?.[recipeKey];

  return null;
}

// mission briefing data generator
function generateMissionBriefing(bean, recipe, engineMeta, brewType) {
  let threat = "No active threats identified.";
  if (engineMeta?.reasons?.length) {
    const r = engineMeta.reasons;
    if (r.some(x => /espresso roast/i.test(x)))     threat = "Espresso roast on pour-over — higher solubility; corpse water risk if dialed too fine";
    else if (r.some(x => /fruity/i.test(x)))         threat = "Fruity origin active — acidity pull risk if extraction runs long";
    else if (r.some(x => /delicate|fragile/i.test(x))) threat = "Delicate process — fragile aromatics; ash risk at elevated temp";
    else if (r.some(x => /dark roast/i.test(x)))     threat = "Dark roast — low extraction ceiling; ash onset is quick";
    else if (r.some(x => /porous/i.test(x)))         threat = "Porous origin — narrow window; channeling risk at fine settings";
    else if (r.some(x => /dense/i.test(x)))          threat = "Dense origin — high potential; rewards fine grind";
    else if (r.some(x => /chocolate/i.test(x)))      threat = "Chocolate-forward — integration pour required for body";
    else                                              threat = r[0];
  } else if (recipe.locked) {
    threat = "Protocol dialed — all clear. Execute.";
  } else if (engineMeta?.basis === "preset") {
    threat = "Preset protocol loaded — engine calibrated for this bean.";
  }

  const isBrikka = brewType === "brikka";
  const minC = Math.max(isBrikka ? 12 : 12, (recipe.clicks || 24) - 1);
  const maxC = Math.min(isBrikka ? 15 : 26, (recipe.clicks || 24) + 1);
  let killZone = `${minC}–${maxC} clicks`;
  if (recipe.temp) {
    killZone += ` · ${Math.max(88, recipe.temp - 1)}–${Math.min(96, recipe.temp + 1)}°C`;
  }
  return { threat, killZone };
}

// boot sequence — one per session
function bootSequence(onComplete) {
  if (state.settings.skipBoot || sessionStorage.getItem("bl_booted")) { onComplete(); return; }
  sessionStorage.setItem("bl_booted", "1");

  const beanCount = allBeans().length;
  const histCount = state.history.length;
  const lines = [
    { text: "BREW LAB V3.6 // PHANTOM TRIAL", cls: "title" },
    { text: "─────────────────────────────────────", cls: "dim" },
    { text: "" },
    { text: `> INIT EXTRACTION ENGINE..........  OK` },
    { text: `> LOAD ORIGIN PROFILES............  OK` },
    { text: `> LOAD BEAN ARCHIVE...............  OK  [${beanCount} ENTRIES]` },
    { text: `> LOAD ARCHIVE....................  OK  [${histCount} PROTOCOLS]` },
    { text: `> CALIBRATE DOSE ENGINE...........  OK` },
    { text: `> PHANTOM TRIAL MODE..............  ACTIVE` },
    { text: "" },
    { text: `> STANDING BY.`, cls: "amber" },
  ];

  const overlay = document.createElement("div");
  overlay.className = "boot-overlay";
  overlay.innerHTML = `<div class="boot-inner"><div class="boot-lines" id="bl-lines"></div><div class="boot-skip">TAP TO SKIP</div></div>`;
  document.body.appendChild(overlay);

  const linesEl = overlay.querySelector("#bl-lines");
  let i = 0;

  const skip = () => {
    overlay.classList.add("fade-out");
    setTimeout(() => { overlay.remove(); onComplete(); }, 300);
  };
  overlay.addEventListener("click", skip);

  function tick() {
    if (i >= lines.length) {
      setTimeout(skip, 500);
      return;
    }
    const { text, cls } = lines[i++];
    const el = document.createElement("div");
    el.className = "boot-line" + (cls ? " " + cls : "");
    el.textContent = text;
    linesEl.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    setTimeout(tick, text === "" ? 60 : 110);
  }
  tick();
}

// ==========================================================
function renderStatusBar() {
  const el = document.createElement("div");
  el.className = "hud-bar";

  // status cell
  let statusText = "STANDBY", statusClass = "";
  if (state.recipe?.locked)           { statusText = "DIALED";   statusClass = "sv-locked"; el.classList.add("locked"); }
  else if (state.recipe)              { statusText = "ACTIVE";   statusClass = "sv-active"; }
  else if (state.aiLoading)           { statusText = "COMPILING"; statusClass = "sv-active"; }
  else if (state.screen === "history"){ statusText = "ARCHIVE";  statusClass = "sv-nav"; }
  else if (state.screen === "settings"){ statusText = "SYSTEM";  statusClass = "sv-nav"; }
  else if (state.screen === "addBean"){ statusText = "REGISTER"; statusClass = "sv-nav"; }
  else if (state.screen === "voidlog"){ statusText = "VOID.LOG"; statusClass = "sv-hidden"; }

  // bean + sys cells — idle state shows OPERATOR LOADOUT
  const isIdle = state.screen === "home" && !state.selectedBean;
  let beanLabel = "BEAN", beanVal = "—";
  let sysLabel = "PROTOCOL", sysVal = "—";

  if (isIdle) {
    beanLabel = "OPERATOR"; beanVal = "LOADOUT";
    sysLabel  = "GEAR";     sysVal  = "C40 · V60";
  } else if (state.selectedBean) {
    const raw = state.selectedBean.name.toUpperCase();
    beanVal = raw.length > 16 ? raw.slice(0, 14) + "…" : raw;
    if (state.brewType && state.method) {
      sysVal = `${state.brewType.toUpperCase()} ${state.method.replace("_"," ").toUpperCase()}`;
    } else if (state.brewType) {
      sysVal = state.brewType.toUpperCase();
    }
  }

  el.innerHTML = `
    <div class="hud-cell brand" id="version-tap">
      <div class="hud-value brand-name">BREW LAB</div>
      <div class="hud-ver">V3.6 // PHANTOM</div>
    </div>
    <div class="hud-cell hc-bean">
      <div class="hud-label">${beanLabel}</div>
      <div class="hud-value">${beanVal}</div>
    </div>
    <div class="hud-cell hc-sys">
      <div class="hud-label">${sysLabel}</div>
      <div class="hud-value">${sysVal}</div>
    </div>
    <div class="hud-cell hc-status">
      <div class="hud-label">STATUS</div>
      <div class="hud-value ${statusClass}">◆ ${statusText}</div>
    </div>
  `;

  // long-press → VOID.LOG  |  short tap → 5-tap counter
  const brand = el.querySelector("#version-tap");
  let lpTimer = null, lpFired = false;
  brand.addEventListener("touchstart", () => {
    lpFired = false;
    lpTimer = setTimeout(() => { lpFired = true; state.screen = "voidlog"; render(); }, 650);
  }, { passive: true });
  brand.addEventListener("touchend", () => { clearTimeout(lpTimer); lpTimer = null; });
  brand.addEventListener("touchmove", () => { clearTimeout(lpTimer); lpTimer = null; }, { passive: true });
  brand.addEventListener("click", () => { if (!lpFired) onVersionTap(); lpFired = false; });

  return el;
}

        <div class="helper-text">Typical V60: 14–20g · Brikka: 15–16g</div>
      </div>

          ${[14,15,16,17].map(r => `<button data-ratio="${r}" class="${state.ratio===r?"selected":""}">1:${r}</button>`).join("")}
        </div>

      </div>` : ""}

    <button class="btn ghost" data-back="1" style="margin-top: 8px;">← Back</button>
  `;

  wrap.querySelector("#dose-input").addEventListener("input", e => {

    if (isV60) {
      const h = wrap.querySelector(".helper-text:last-of-type");
      if (h && h.textContent.startsWith("Total")) h.textContent = `Total water will be ${state.dose * state.ratio}g`;
    }
  });

      const r = parseInt(e.target.dataset.ratio); if (!r) return;
      state.ratio = r; render();
    });

  wrap.querySelector("#go-btn").addEventListener("click", generateRecipe);
  wrap.querySelector("[data-back]").addEventListener("click", () => { state.screen = "bean"; render(); });
  return wrap;
}

// ==========================================================
// GENERATE RECIPE
// ==========================================================
function generateRecipe() {
  const bean = state.selectedBean;
  const recipeKey = recipeKeyFor(state.brewType, state.method);
  state.recipeKey = recipeKey;
  const result = getRecipeForBean(bean, recipeKey, state.brewType);
  if (!result) { toast("Cannot generate recipe"); return; }

  state.recipe = { ...result.recipe, ratio: state.ratio };
  state.engineMeta = {
    basis: result.basis,
    reasons: result.meta?.reasons || [],
    confidence: result.meta?.confidence || "high",
    aiInvoked: false,
    aiRationale: null
  };

  if (state.brewType === "v60") {
    state.pourSchedule = generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle, state.method === "iced");
  }

  if (result.basis === "smart_default" && result.meta?.confidence === "low" && state.apiKey) {
    state.aiLoading = true; state.screen = "recipe"; render();
    askAdvisor({ bean, recipeKey, currentRecipe: state.recipe, feedbackHistory: [], mode: "fill", apiKey: state.apiKey })
      .then(res => {
        state.aiLoading = false; state.aiResult = res;
        if (res.ok) {
          state.engineMeta.aiInvoked = true; state.engineMeta.aiRationale = res.rationale;
          state.recipe.clicks = res.clicks; state.recipe.temp = res.temp;
          state.recipe.pourStyle = res.pourStyle; state.recipe.ratio = res.ratio;
          if (state.brewType === "v60") {
            state.pourSchedule = generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle, state.method === "iced");
          }
        }
        render();
      });
    return;
  }
  state.screen = "recipe"; render();
}

      <button class="btn ghost" id="discard-btn">DISCARD</button>
      <button class="btn primary" id="apply-btn">${applyLabel}</button>
    </div>
    ${showAskAI?`<button class="btn ghost" id="ask-ai-btn" style="margin-top:8px;">${state.aiLoading?"◇ COMPILING...":"◇ AI SANITY CHECK"}</button>`:""}
    ${!state.apiKey&&state.feedback.length>0&&!state.feedback.includes("perfect")?`<div class="helper-text" style="margin-top:8px;text-align:center;">Set API key in SYS to enable AI advisor</div>`:""}
  `;

  card.innerHTML = html;
  wrap.appendChild(card);

  card.querySelector("#fb-grid").addEventListener("click", e => {
    const fb = e.target.dataset.fb; if (!fb) return;
    state.aiAdjustment = null;
    if (fb === "perfect") {
      state.feedback = ["perfect"]; state.adjustment = null;
    } else {
      state.feedback = state.feedback.filter(f => f !== "perfect");
      state.feedback.includes(fb) ? state.feedback.splice(state.feedback.indexOf(fb),1) : state.feedback.push(fb);
      state.adjustment = state.feedback.length ? processFeedback({ currentRecipe:r, feedback:state.feedback, recipeKey:state.recipeKey }) : null;
    }
    render();
  });

  const notesRow = card.querySelector("#notes-row");
  if (notesRow) {
    notesRow.addEventListener("click", e => {
      const note = e.target.dataset.note; if (!note) return;
      const cur = state.taggedNotes[note];
      state.taggedNotes[note] = cur==="achieved" ? "missed" : cur==="missed" ? undefined : "achieved";
      render();
    });
  }

  card.querySelector("#dev-toggle").addEventListener("click", () => {
    const area = card.querySelector("#dev-area"); const tog = card.querySelector("#dev-toggle");
    area.classList.toggle("open"); tog.classList.toggle("open");
    if (area.classList.contains("open")) card.querySelector("#dev-note-input").focus();
  });
  card.querySelector("#dev-note-input").addEventListener("input", e => { state.pendingDevNote = e.target.value; });
  card.querySelector("#discard-btn").addEventListener("click", () => { state.screen = "recipe"; render(); });
  card.querySelector("#apply-btn").addEventListener("click", applyFeedback);

  const askBtn = card.querySelector("#ask-ai-btn");
  if (askBtn) {
    askBtn.addEventListener("click", async () => {
      if (state.aiLoading) return;
      state.aiLoading = true; render();
      const fbEntry = { settings: { clicks:r.clicks, temp:r.temp }, feedback: state.feedback };
      const res = await askAdvisor({ bean:state.selectedBean, recipeKey:state.recipeKey, currentRecipe:r, feedbackHistory:[fbEntry], mode:"adjust", apiKey:state.apiKey });
      state.aiLoading = false; state.aiAdjustment = res;
      if (res.ok) { state.engineMeta = state.engineMeta||{}; state.engineMeta.aiInvoked = true; state.engineMeta.aiRationale = res.rationale; }
      render();
    });
  }
  return wrap;
}

// ==========================================================
// APPLY FEEDBACK — archive write
// ==========================================================
function applyFeedback() {
  const r = state.recipe;
  const bean = state.selectedBean;
  const isPerfect = state.feedback.includes("perfect");
  const useAI = state.aiAdjustment?.ok;

  let finalClicks = r.clicks, finalTemp = r.temp, finalPourStyle = r.pourStyle, appliedSource = null;

  if (isPerfect) {
    appliedSource = "locked";
  } else if (useAI) {
    finalClicks = state.aiAdjustment.clicks;
    finalTemp = state.aiAdjustment.temp!=null ? state.aiAdjustment.temp : r.temp;
    finalPourStyle = state.aiAdjustment.pourStyle!=null ? state.aiAdjustment.pourStyle : r.pourStyle;
    appliedSource = "ai";
  } else if (state.adjustment?.type === "adjustment") {
    finalClicks = state.adjustment.adjustment.clicks;
    finalTemp = state.adjustment.adjustment.temp || r.temp;
    appliedSource = "local";
  }

  const entry = {
    id: "brew-" + Date.now(),
    date: new Date().toISOString(),
    beanId: bean.id, beanName: bean.name,
    recipeKey: state.recipeKey,
    dose: state.dose, ratio: state.ratio,
    settings: { clicks:r.clicks, temp:r.temp, pourStyle:r.pourStyle },
    feedback: state.feedback,
    notes: { ...state.taggedNotes },
    adjustment: appliedSource==="ai"
      ? { clicks:finalClicks, temp:finalTemp, pourStyle:finalPourStyle, source:"ai" }
      : (state.adjustment?.adjustment ? { ...state.adjustment.adjustment, source:"local" } : null),
    adjustmentApplied: appliedSource==="ai" || appliedSource==="local",
    engineMeta: state.engineMeta,
    aiAdjustment: useAI ? {
      clicks:state.aiAdjustment.clicks, temp:state.aiAdjustment.temp,
      pourStyle:state.aiAdjustment.pourStyle, rationale:state.aiAdjustment.rationale,
      confidence:state.aiAdjustment.confidence
    } : null,
    devNote: state.pendingDevNote || null
  };
  state.history.unshift(entry);
  if (state.history.length > 100) state.history.length = 100;
  save(KEYS.history, state.history);

  // persist recipe changes
  if (isPerfect)           persistBeanRecipe(bean, state.recipeKey, { ...r, locked: true });
  else if (appliedSource==="ai")    persistBeanRecipe(bean, state.recipeKey, { ...r, clicks:finalClicks, temp:finalTemp, pourStyle:finalPourStyle });
  else if (appliedSource==="local") persistBeanRecipe(bean, state.recipeKey, { ...r, clicks:finalClicks, temp:finalTemp });

  // reset state
  state.feedback = []; state.taggedNotes = {}; state.adjustment = null;
  state.aiAdjustment = null; state.pendingDevNote = "";
  state.recipe = null; state.selectedBean = null;
  state.brewType = null; state.method = null;

  if (isPerfect) {
    state.justLockedId = entry.id;
    showAcquiredOverlay(entry.settings, () => {
      toast("◆ DIALED. PROTOCOL LOCKED.");
      state.screen = "history"; render();
    });
  } else {
    if (appliedSource==="ai")     toast(`AI APPLIED: ${finalClicks}c${finalTemp?", "+finalTemp+"°C":""}`);
    else if (appliedSource==="local") toast(`FILED: ${finalClicks}c${finalTemp?", "+finalTemp+"°C":""}`);
    else                              toast("FILED.");
    state.screen = "history"; render();
  }
}

function persistBeanRecipe(bean, recipeKey, recipe) {
  const existing = state.customBeans.find(b => b.id === bean.id);
  if (existing) {
    existing.recipes = existing.recipes || {}; existing.recipes[recipeKey] = recipe; save(KEYS.beans, state.customBeans);
  } else if (!bean.custom) {
    const clone = JSON.parse(JSON.stringify(bean));
    clone.recipes = clone.recipes || {}; clone.recipes[recipeKey] = recipe; clone.id = bean.id;
    state.customBeans.push(clone); save(KEYS.beans, state.customBeans);
  } else {
    bean.recipes = bean.recipes || {}; bean.recipes[recipeKey] = recipe; save(KEYS.beans, state.customBeans);
  }
}

function allBeansResolved() {
  const customIds = new Set(state.customBeans.map(b => b.id));
  return [...PRESETS.filter(p => !customIds.has(p.id)), ...state.customBeans];
}
allBeans = allBeansResolved;

// ==========================================================
// VOID.LOG EXPORT
// ==========================================================
function exportDevLog() {
  const lines = [];
  lines.push("BREW LAB — VOID.LOG");
  lines.push(`Exported: ${new Date().toISOString()}`);
  lines.push(`Protocols filed: ${state.history.length}`);
  lines.push("==========================================");
  lines.push("");
  for (const h of state.history) {
    lines.push(`# ${h.beanName} · ${h.recipeKey} · ${fmtDate(h.date)}`);
    lines.push(`Recipe: ${h.dose}g · ${h.settings.clicks} clicks · ${h.settings.temp||"—"}°C · ${h.settings.pourStyle||"—"} · 1:${h.ratio}`);
    if (h.engineMeta) {
      lines.push(`Basis: ${h.engineMeta.basis} (confidence: ${h.engineMeta.confidence})`);
      if (h.engineMeta.reasons?.length) { lines.push("  Reasons:"); h.engineMeta.reasons.forEach(r => lines.push(`    → ${r}`)); }
      if (h.engineMeta.aiInvoked) lines.push(`  AI rationale: ${h.engineMeta.aiRationale||"—"}`);
    }
    const tagged = Object.entries(h.notes||{}).filter(([,v])=>v);
    if (tagged.length) lines.push(`Tasting notes: ${tagged.map(([k,v])=>`${k}=${v}`).join(", ")}`);
    lines.push(`Feedback: ${h.feedback?.length?h.feedback.join(", "):"—"}`);
    if (h.adjustment) {
      const src = h.adjustment.source||"local";
      lines.push(`Adjustment applied (${src}): ${h.adjustment.clicks} clicks${h.adjustment.temp?", "+h.adjustment.temp+"°C":""}${h.adjustment.pourStyle?", "+h.adjustment.pourStyle:""}`);
    }
    if (h.aiAdjustment) {
      lines.push(`AI adjustment: ${h.aiAdjustment.clicks}c, ${h.aiAdjustment.temp}°C, ${h.aiAdjustment.pourStyle} (${h.aiAdjustment.confidence})`);
      lines.push(`  AI rationale: ${h.aiAdjustment.rationale}`);
    }
    if (h.devNote) lines.push(`FIELD NOTE: ${h.devNote}`);
    lines.push("");
  }
  const text = lines.join("\n");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(()=>toast("VOID.LOG EXPORTED"), ()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("VOID.LOG EXPORTED"); }
  catch { toast("Copy failed — try again"); }
  document.body.removeChild(ta);
}

        <div class="vl-line bright">// ai invocations............. <span class="vl-val">${aiCount}</span></div>
        <div class="vl-line bright">// current streak............. <span class="vl-val">${streak}</span></div>
        <div class="vl-line"> </div>
        <div class="vl-line">// bean archive contains <span class="vl-val">${allBeans().length}</span> entries.</div>
        ${perfect>0?`<div class="vl-line">// operator has dialed <span class="vl-val">${perfect}</span> perfect extraction${perfect!==1?"s":""}.</div>`:""}
        ${warCrimes>0?`<div class="vl-line">// <span class="vl-val">${warCrimes}</span> dead cup${warCrimes!==1?"s":""} logged as war crime${warCrimes!==1?"s":""}.</div>`:""}
        <div class="vl-line">// the extraction engine listens.</div>
        <div class="vl-line">// the kill zone narrows.</div>
        <div class="vl-line"> </div>
        <div class="vl-line amber">// SC2K13 // dedicated to the creatures of the night</div>
      </div>
      <div class="vl-footer">╚═══════════════════════════════════════╝</div>
    </div>

    <div style="margin-top:20px;">
      <button class="btn danger" id="burn-archive">◆ BURN ARCHIVE — ERASE HISTORY</button>
      <button class="btn ghost" id="vl-back" style="margin-top:8px;">← RETURN</button>
    </div>
  `;

  wrap.querySelector("#burn-archive").addEventListener("click", () => {
    if (confirm("Burn the archive? All brew history will be erased. Cannot undo.")) {
      state.history = []; save(KEYS.history, state.history); toast("ARCHIVE BURNED"); state.screen = "home"; render();
    }
  });
  wrap.querySelector("#vl-back").addEventListener("click", () => { state.screen = "home"; render(); });
  return wrap;
}

// ==========================================================
// VERSION TAP (5 taps = VOID.LOG export  |  long-press = VOID.LOG screen)
// ==========================================================
function onVersionTap() {
  state.versionTapCount++;
  if (state.versionTapCount >= 5) { state.versionTapCount = 0; exportDevLog(); }
  setTimeout(() => { state.versionTapCount = 0; }, 2000);
}

// ==========================================================
// BOOT
// ==========================================================
applyCrtMode();
bootSequence(render);
</script>
</body>
</html>
