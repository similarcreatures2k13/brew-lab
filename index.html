<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Lab">
<meta name="theme-color" content="#1a1612">
<title>Brew Lab V3.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0d0a08;
    --bg-shell: #1a1612;
    --bg-raised: #241d18;
    --bg-deepest: #050403;
    --line-faint: #2a221c;
    --line-strong: #4a3a2c;
    --text-primary: #f0e6dc;
    --text-muted: #8a7a6a;
    --text-ghost: #4a3a2c;
    --gold: #c8956c;
    --gold-glow: #e5b380;
    --gold-deep: #8a6240;
    --green-lock: #6b8e5a;
    --red-miss: #8e5a5a;
    --blue-cool: #5a7a8e;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ui: 'Inter Tight', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--ui);
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select {
    font-family: inherit;
    background: var(--bg-shell);
    color: var(--text-primary);
    border: 1px solid var(--line-strong);
    padding: 12px;
    font-size: 15px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
  textarea { resize: vertical; min-height: 80px; }

  /* status bar */
  .status-bar {
    position: sticky; top: 0;
    background: var(--bg-deepest);
    border-bottom: 1px solid var(--line-faint);
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    z-index: 10;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .status-bar .sep { color: var(--text-ghost); }
  .status-bar .crumb { color: var(--text-primary); }
  .status-bar .right { margin-left: auto; }
  .status-bar.locked .status-dot { background: var(--green-lock); }

  /* app header */
  .app-header {
    padding: 20px 16px 8px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .app-header h1 {
    font-family: var(--mono); font-weight: 700;
    font-size: 22px; letter-spacing: 0.02em;
  }
  .app-header .version {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-ghost); letter-spacing: 0.1em;
  }

  .section { padding: 12px 16px; }
  .section h2 {
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-muted); margin-bottom: 10px;
  }

  /* card pattern */
  .card {
    position: relative;
    border: 1px solid var(--line-faint);
    background: var(--bg-shell);
    padding: 18px 16px 16px;
    margin-bottom: 12px;
  }
  .card-label {
    position: absolute; top: -7px; left: 12px;
    background: var(--bg-void);
    padding: 0 8px;
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-muted);
  }
  .card.locked { border-color: var(--green-lock); }
  .card.locked .card-label { color: var(--green-lock); }
  .lock-marker {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.15em; color: var(--green-lock);
  }
  .lock-marker::before { content: "◆ "; }

  .bean-name {
    font-size: 19px; font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: 4px;
  }
  .bean-meta {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .bean-meta .sep { color: var(--text-ghost); margin: 0 6px; }
  .bean-meta .roast-intent {
    color: var(--gold); font-weight: 500;
  }
  .bean-notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .note-chip {
    font-family: var(--mono); font-size: 10px;
    padding: 4px 8px; border: 1px solid var(--line-strong);
    color: var(--text-muted); letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .note-chip.achieved { color: var(--green-lock); border-color: var(--green-lock); }
  .note-chip.missed { color: var(--red-miss); border-color: var(--red-miss); }

  /* data grid */
  .data-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    margin-top: 12px; border-top: 1px solid var(--line-faint);
  }
  .data-cell {
    padding: 12px;
    border-bottom: 1px solid var(--line-faint);
  }
  .data-cell:nth-child(odd) { border-right: 1px solid var(--line-faint); }
  .data-cell:last-child, .data-cell:nth-last-child(2):nth-child(odd) { border-bottom: none; }
  .data-cell .label {
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.15em;
    color: var(--text-muted); margin-bottom: 4px;
  }
  .data-cell .value {
    font-family: var(--mono); font-size: 18px;
    font-weight: 500;
  }
  .data-cell .value.large { font-size: 24px; font-weight: 600; }
  .data-cell .value .unit { font-size: 11px; color: var(--text-muted); margin-left: 3px; }

  /* pour timeline */
  .pour-timeline { margin-top: 6px; }
  .pour-step {
    display: grid; grid-template-columns: 60px 1fr;
    gap: 14px; padding: 12px 0;
    border-bottom: 1px solid var(--line-faint);
    position: relative;
  }
  .pour-step:last-child { border-bottom: none; }
  .pour-step::before {
    content: ""; position: absolute;
    left: 50px; top: 0; bottom: 0; width: 1px;
    background: var(--line-strong);
  }
  .pour-step::after {
    content: ""; position: absolute;
    left: 47px; top: 16px; width: 7px; height: 7px;
    border: 1px solid var(--gold); background: var(--bg-shell);
    transform: rotate(45deg);
  }
  .pour-step .time {
    font-family: var(--mono); font-size: 12px;
    color: var(--gold); font-weight: 500;
  }
  .pour-step .weight {
    font-family: var(--mono); font-size: 14px;
    font-weight: 500; margin-bottom: 2px;
  }
  .pour-step .instr { font-size: 12px; color: var(--text-muted); }

  /* buttons */
  .btn {
    min-height: 48px; padding: 12px 16px;
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--text-primary);
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.1em;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; width: 100%;
  }
  .btn:active { background: var(--bg-raised); }
  .btn.primary { border-color: var(--gold); color: var(--gold); }
  .btn.primary:active { background: var(--gold); color: var(--bg-void); }
  .btn.danger { border-color: var(--red-miss); color: var(--red-miss); }
  .btn.ghost { border-color: var(--line-faint); color: var(--text-muted); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn-row.three { grid-template-columns: repeat(3, 1fr); }
  .btn-stack > .btn { margin-bottom: 8px; }

  /* chips */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 14px;
    border: 1px solid var(--line-faint);
    background: var(--bg-shell);
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip::before { content: "◇"; color: var(--text-ghost); }
  .chip.selected {
    border-color: var(--gold); color: var(--gold);
    background: var(--bg-raised);
  }
  .chip.selected::before { content: "◆"; color: var(--gold); }
  .chip.perfect {
    border-color: var(--green-lock); color: var(--green-lock);
    width: 100%; justify-content: center;
  }
  .chip.perfect::before { content: "✓"; }

  /* feedback grid */
  .feedback-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 8px;
  }
  .feedback-grid .chip {
    padding: 12px 10px;
    text-align: left; justify-content: flex-start;
  }
  .feedback-grid .chip.perfect { grid-column: 1 / -1; }

  /* bean grid */
  .bean-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  .bean-grid .card {
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .bean-grid .card:active { border-color: var(--gold); }
  .bean-grid .card.custom .card-label::after {
    content: " · CUSTOM";
    color: var(--gold-deep);
  }

  /* adjustment preview */
  .adjustment {
    margin-top: 14px; padding: 12px;
    border-left: 2px solid var(--gold);
    background: var(--bg-deepest);
    font-family: var(--mono); font-size: 12px;
  }
  .adjustment .head {
    color: var(--gold); text-transform: uppercase;
    letter-spacing: 0.1em; font-size: 10px; margin-bottom: 6px;
  }
  .adjustment .change { line-height: 1.7; }
  .arrow { color: var(--text-ghost); margin: 0 6px; }
  .new { color: var(--gold-glow); }
  .adjustment .why {
    color: var(--text-muted); margin-top: 8px; font-size: 11px;
    font-family: var(--ui); line-height: 1.5;
  }

  /* dev note */
  .dev-note-toggle {
    margin-top: 12px;
    font-family: var(--mono); font-size: 10px;
    color: var(--text-muted); letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none; border: none; padding: 6px 0;
  }
  .dev-note-toggle::before { content: "[+ "; color: var(--text-ghost); }
  .dev-note-toggle::after { content: " ]"; color: var(--text-ghost); }
  .dev-note-toggle.open::before { content: "[− "; }
  .dev-note-area {
    margin-top: 8px; display: none;
  }
  .dev-note-area.open { display: block; }
  .dev-note-area textarea {
    background: var(--bg-deepest);
    border-color: var(--line-faint);
    font-family: var(--mono); font-size: 12px;
  }

  /* form bits */
  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block; margin-bottom: 6px;
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .three-toggle {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border: 1px solid var(--line-strong);
  }
  .three-toggle button {
    background: transparent; border: none; padding: 12px 4px;
    color: var(--text-muted);
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
    border-right: 1px solid var(--line-strong);
  }
  .three-toggle button:last-child { border-right: none; }
  .three-toggle button.selected {
    background: var(--bg-raised); color: var(--gold);
  }
  .helper-text {
    font-size: 11px; color: var(--text-muted);
    margin-top: 6px; line-height: 1.4;
  }

  /* tab bar */
  .tab-bar {
    position: sticky; bottom: 0;
    background: var(--bg-deepest);
    border-top: 1px solid var(--line-faint);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    padding: 14px 0; text-align: center;
    font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-muted);
    border: none; background: transparent;
    border-top: 2px solid transparent;
  }
  .tab.active { color: var(--gold); border-top-color: var(--gold); }

  /* hidden version long-press for dev log */
  .version-tap {
    user-select: none;
    -webkit-user-select: none;
  }

  /* history entry */
  .history-entry {
    padding: 12px 0;
    border-bottom: 1px solid var(--line-faint);
  }
  .history-entry .head {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; align-items: baseline;
  }
  .history-entry .bean { font-weight: 600; }
  .history-entry .date {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-muted);
  }
  .history-entry .settings {
    font-family: var(--mono); font-size: 12px;
    color: var(--text-muted);
  }
  .history-entry .feedback {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .history-entry .dev-note {
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--bg-deepest);
    border-left: 2px solid var(--gold-deep);
    font-family: var(--mono); font-size: 11px;
    color: var(--text-primary);
  }

  .empty-state {
    padding: 40px 20px; text-align: center;
    color: var(--text-muted); font-size: 13px;
  }

  /* toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-raised);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 12px 20px;
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.1em;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* loading */
  .loading {
    display: inline-block;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

<script>
"use strict";

// ==========================================================
// DATA: Origin Profiles
// ==========================================================
const ORIGIN_DENSITY = {
  Kenya: 0.85, Colombia: 0.75, Ethiopia: 0.70, Guatemala: 0.70,
  "Costa Rica": 0.70, "El Salvador": 0.65, Rwanda: 0.65, Burundi: 0.65,
  Honduras: 0.60, Mexico: 0.60, Peru: 0.60, Brazil: 0.50,
  India: 0.45, Indonesia: 0.40, Sumatra: 0.35, Malaysia: 0.30,
  Vietnam: 0.30, PNG: 0.55, "Papua New Guinea": 0.55
};
const PROCESS_SOLUBILITY = {
  Washed: 0.40, Honey: 0.55, Natural: 0.70,
  Cofermentation: 0.75, Anaerobic: 0.80, "Wet-hulled": 0.65, Experimental: 0.75
};
const FRUITY_ORIGINS = ["Kenya", "Ethiopia", "Burundi", "Rwanda"];
const CHOCOLATE_ORIGINS = ["Brazil", "Mexico", "Peru", "Honduras"];

function weightedOriginProfile(origins) {
  if (!origins || origins.length === 0) {
    return { density: 0.6, solubility: 0.5, fruity: false, chocolate: false, delicate: false };
  }
  const total = origins.reduce((s, o) => s + (o.share || 0), 0) || 1;
  let density = 0, solubility = 0;
  let fruity = false, chocolate = false, delicate = false;
  for (const o of origins) {
    const w = (o.share || 0) / total;
    density += w * (ORIGIN_DENSITY[o.country] ?? 0.6);
    solubility += w * (PROCESS_SOLUBILITY[o.process] ?? 0.5);
    if (FRUITY_ORIGINS.includes(o.country)) fruity = true;
    if (CHOCOLATE_ORIGINS.includes(o.country)) chocolate = true;
    if (o.process === "Cofermentation" || o.process === "Anaerobic") delicate = true;
  }
  return { density, solubility, fruity, chocolate, delicate };
}

// ==========================================================
// ENGINE: Smart Defaults
// ==========================================================
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function smartDefaultsV60(bean, brewType) {
  const { roast = {}, tastingNotes = [], origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 24, temp = 92, pourStyle = "layered";
  const reasons = [], signals = [];

  if (profile.density > 0.7) { clicks -= 2; temp += 1; reasons.push("dense origin → finer + warmer"); signals.push("dense"); }
  if (profile.density < 0.4) { clicks += 2; temp -= 1; pourStyle = "even"; reasons.push("porous origin → coarser + cooler"); signals.push("porous"); }
  if (profile.fruity) { clicks -= 1; temp -= 1; pourStyle = "descending"; reasons.push("fruity origin → descending pour, gentle temp"); signals.push("fruity"); }
  if (profile.chocolate && !profile.fruity) { temp += 1; pourStyle = pourStyle === "layered" ? "even" : pourStyle; reasons.push("chocolate-leaning → integration pour"); signals.push("chocolate"); }
  if (profile.delicate) { clicks += 2; temp -= 1; if (pourStyle === "layered") pourStyle = "descending"; reasons.push("delicate/porous process → coarser + cooler"); signals.push("delicate"); }
  if (origins.some(o => o.process === "Wet-hulled")) { clicks += 1; reasons.push("wet-hulled → +1 click for porosity"); signals.push("wet-hulled"); }
  if (origins.some(o => /liberica/i.test(o.variety || ""))) { clicks -= 2; temp -= 1; pourStyle = "even"; reasons.push("liberica species → counter-balance porous"); signals.push("liberica"); }

  if (roast.intent === "Espresso") {
    clicks += 2; temp -= 1; pourStyle = "even";
    reasons.push("espresso roast → more soluble, coarser + cooler, integrate");
    signals.push("espresso");
  }

  if (/dark/i.test(roast.level || "")) { clicks += 1; temp -= 1; reasons.push("dark roast → coarser, cooler"); }
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") { temp += 1; reasons.push("light filter → develop with heat"); }

  if (brewType === "iced") {
    if (signals.includes("fruity") || signals.includes("delicate")) { clicks += 1; reasons.push("iced + fragile → +1 click"); }
    if (pourStyle === "layered") pourStyle = "descending";
  }

  const fragile = /jasmine|lemongrass|osmanthus|bergamot|elderflower|peach|lychee/i;
  if (tastingNotes.some(n => fragile.test(n))) { temp = Math.min(temp, 91); reasons.push("fragile aromatics → cap temp at 91°C"); }

  let confidence = "medium";
  if (signals.length >= 3) confidence = "high";
  if (origins.length >= 3) confidence = "low";
  if (!roast.intent || roast.intent === "Omni") { if (confidence === "high") confidence = "medium"; }

  return { clicks: clamp(clicks, 12, 26), temp: clamp(temp, 88, 96), pourStyle, ratio: 15, locked: false, confidence, reasons, signals };
}

function smartDefaultsBrikka(bean) {
  const { roast = {}, origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 13, baseWaterTemp = "boiling";
  const reasons = [];
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") { clicks = 14; baseWaterTemp = "95C-cool-30s"; reasons.push("light filter → finer + cooler base"); }
  if (profile.density < 0.4) { clicks = 14; reasons.push("porous → finer"); }
  if (origins.some(o => /sarchimor|parainema|catimor/i.test(o.variety || ""))) { clicks = 13; reasons.push("robusta heritage variety → standard"); }
  return { clicks, baseWaterTemp, drinkStyle: "neat", locked: false, confidence: "high", reasons };
}

// ==========================================================
// ENGINE: Pour Schedules
// ==========================================================
function roundTo(n, step = 5) { return Math.round(n / step) * step; }
function pourCount(dose) { if (dose <= 12) return 3; if (dose <= 18) return 4; return 5; }
function bloomG(dose) { return roundTo(dose * 2.5, 5); }

function buildLayered(dose, ratio) {
  const total = dose * ratio, bloom = bloomG(dose), pours = pourCount(dose);
  const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.4, 0.35, 0.25] : [0.32, 0.28, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5);
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "Concentric circles, center-out." : "Continue. Thin steady stream." });
    t += pours <= 3 ? 30 : 25;
  });
  const last = steps[steps.length - 1];
  last.add += total - last.running;
  last.running = total;
  return { steps, total, drawdown: t + 30 };
}
function buildDescending(dose, ratio) {
  const total = dose * ratio, bloom = roundTo(dose * 3, 5), pours = pourCount(dose);
  const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.42, 0.32, 0.26] : [0.34, 0.26, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Big bloom. Spiral, swirl firmly." }];
  let running = bloom, t = 50;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5);
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pour. Wide spiral, fruit-forward." : i === weights.length - 1 ? "Finishing pour. Thin stream, hold the center." : "Tighter spiral, slow flow." });
    t += 30;
  });
  const last = steps[steps.length - 1];
  last.add += total - last.running;
  last.running = total;
  return { steps, total, drawdown: t + 30 };
}
function buildEven(dose, ratio) {
  const total = dose * ratio, bloom = bloomG(dose), pours = pourCount(dose);
  const remaining = total - bloom;
  const each = roundTo(remaining / (pours - 1), 5);
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  for (let i = 0; i < pours - 1; i++) {
    const add = i === pours - 2 ? total - running : each;
    running += add;
    steps.push({ t, add, running, instr: `Equal pour ${i + 1}. Steady concentric pour.` });
    t += 25;
  }
  return { steps, total, drawdown: t + 30 };
}
function buildCustomEven(dose, ratio, pulseG = 26) {
  const total = dose * ratio;
  const count = Math.ceil(total / pulseG);
  const each = roundTo(total / count, 5);
  const steps = [];
  let running = 0, t = 0;
  for (let i = 0; i < count; i++) {
    const add = i === count - 1 ? total - running : each;
    running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pulse. Saturate fully." : `Pulse ${i + 1}. Same volume, same rhythm.` });
    t += 25;
  }
  return { steps, total, drawdown: t + 30 };
}
function generatePourSchedule(dose, ratio, pourStyle) {
  switch (pourStyle) {
    case "descending": return buildDescending(dose, ratio);
    case "even": return buildEven(dose, ratio);
    case "custom_even": return buildCustomEven(dose, ratio);
    default: return buildLayered(dose, ratio);
  }
}
function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

const FEEDBACK_RULES = {
  sour: { clicks: -1, temp: +1, note: "Underextracted — finer + warmer" },
  bitter: { clicks: +1, temp: -1, note: "Overextracted — coarser + cooler" },
  acrid: { clicks: +1, temp: -1, note: "Harsh overextraction — coarser + cooler" },
  thin: { clicks: -1, temp: 0, note: "Underextracted body — finer" },
  "too-acidic": { clicks: 0, temp: +1, note: "Need more sweetness — bump temp" },
  "flat-muddy": { clicks: +1, temp: 0, note: "Muddied flavors — coarser" },
  "missing-notes": { clicks: -1, temp: +1, note: "Under-extracted aromatics — finer + warmer" }
};
const CHANNELING_PAIRS = [["sour", "bitter"], ["sour", "acrid"]];
const FEEDBACK_OPTIONS = [
  { id: "sour", label: "Sour" },
  { id: "bitter", label: "Bitter" },
  { id: "acrid", label: "Acrid" },
  { id: "thin", label: "Thin" },
  { id: "too-acidic", label: "Too acidic" },
  { id: "flat-muddy", label: "Flat / muddy" },
  { id: "missing-notes", label: "Missing notes" }
];

function processFeedback({ currentRecipe, feedback }) {
  for (const [a, b] of CHANNELING_PAIRS) {
    if (feedback.includes(a) && feedback.includes(b)) {
      return { type: "channeling", diagnosis: "Sour + bitter together = channeling. Bed prep issue, not grind or temp.", action: "Try: wet WDT, level bed, slower bloom. Same settings.", adjustment: null };
    }
  }
  let clicksDelta = 0, tempDelta = 0;
  const reasons = [];
  for (const f of feedback) {
    const rule = FEEDBACK_RULES[f];
    if (!rule) continue;
    clicksDelta += rule.clicks; tempDelta += rule.temp;
    reasons.push(rule.note);
  }
  if (clicksDelta === 0 && tempDelta === 0) {
    return { type: "no-change", diagnosis: "Feedback signals cancel. No clear direction.", action: "Re-brew same settings, focus technique.", adjustment: null };
  }
  clicksDelta = clamp(clicksDelta, -2, 2);
  tempDelta = clamp(tempDelta, -2, 2);
  const adjustment = {
    clicks: clamp(currentRecipe.clicks + clicksDelta, 12, 26),
    temp: currentRecipe.temp ? clamp(currentRecipe.temp + tempDelta, 88, 96) : null
  };
  return { type: "adjustment", diagnosis: reasons.join(". "), adjustment, delta: { clicks: clicksDelta, temp: tempDelta } };
}

const EQUIPMENT_BLOCK = `EQUIPMENT:
- Hand grinder: Commandante C40 (click range 12-26, finer = lower number, default 24)
- Filter brewer: Hario V60 (paper filter)
- Pressure brewer: Bialetti Brikka 4-cup moka pot
- Heat source: Infrared burner at 1600W
- Kettle: Temperature-controlled, Celsius only`;

const AI_ROLES = {
  fill: `ROLE: New bean, no dial-in yet. Generate a starting recipe. Be conservative — user will dial from here. Aim for the gentler/safer end. If espresso roast, it is MORE soluble on V60 — coarser + cooler than filter roast.`,
  adjust: `ROLE: Current recipe is not landing after multiple brews. Diagnose pattern and propose a shift. Treat current values as anchor — adjust, do not replace. Maximum 2 clicks and 2°C from current.`,
  review: `ROLE: Sanity check on current recipe. If it looks correct, say so with high confidence and propose minimal/no changes.`
};

function buildAIPrompt({ bean, recipeKey, currentRecipe, feedbackHistory = [], mode }) {
  const beanCtx = `BEAN:
Name: ${bean.name}
Roaster: ${bean.roaster || "Unknown"}
Roast level: ${bean.roast?.level || "Unknown"}
Roast intent: ${bean.roast?.intent || "Filter"}${bean.roast?.intent === "Espresso" ? "  (espresso roast — more soluble on V60, coarser + cooler than filter roasts)" : ""}
Origins:
${bean.origins.map(o => `  - ${o.country} ${o.variety || ""} ${o.process || ""} (${o.share}%)`).join("\n")}
Tasting notes: ${bean.tastingNotes?.join(", ") || "—"}`;

  const currentCtx = currentRecipe ?
`CURRENT RECIPE (your anchor):
Slot: ${recipeKey}
- Clicks: ${currentRecipe.clicks}
- Temp: ${currentRecipe.temp || "—"}°C
- Pour style: ${currentRecipe.pourStyle || "—"}
- Ratio: 1:${currentRecipe.ratio || 15}
- Locked: ${currentRecipe.locked ? "yes" : "no"}` : `NO CURRENT RECIPE. Generate from scratch.`;

  const feedbackCtx = feedbackHistory.length ?
`RECENT BREWS (most recent last):
${feedbackHistory.slice(-3).map((h, i) => `  ${i + 1}. ${h.settings.clicks} clicks, ${h.settings.temp}°C → ${h.feedback.join(", ")}`).join("\n")}` : "";

  return `${EQUIPMENT_BLOCK}

${beanCtx}

${currentCtx}

${feedbackCtx}

${AI_ROLES[mode]}

OUTPUT — return ONLY this JSON object. No preamble, no markdown fences, no commentary.

{"clicks": INT_12_TO_26, "temp": INT_88_TO_96, "pourStyle": "layered" OR "descending" OR "even" OR "custom_even", "ratio": INT_14_TO_17, "rationale": "STRING max 50 words", "confidence": "high" OR "medium" OR "low"}

HARD RULES:
1. Click numbers only. Never text grind descriptions ("medium-fine" is forbidden).
2. ${mode === "adjust" ? "ADJUST MODE: " : ""}Stay within 2 clicks and 2°C of current recipe.${currentRecipe ? ` Current is ${currentRecipe.clicks} clicks, ${currentRecipe.temp}°C — your output must be in [${Math.max(12, currentRecipe.clicks - 2)}, ${Math.min(26, currentRecipe.clicks + 2)}] clicks and [${Math.max(88, (currentRecipe.temp || 92) - 2)}, ${Math.min(96, (currentRecipe.temp || 92) + 2)}]°C.` : ""}
3. For Brikka, use clicks 12-15. Set temp to ${currentRecipe?.temp || 92} and pourStyle to "even".
4. Espresso roast on V60 needs COARSER and COOLER than filter roast. Counterintuitive but critical.`;
}

function parseAIResponse(text) {
  let cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  if (start >= 0 && end > start) cleaned = cleaned.slice(start, end + 1);
  try {
    const p = JSON.parse(cleaned);
    if (typeof p.clicks !== "number" || p.clicks < 12 || p.clicks > 26) throw new Error(`clicks out of range: ${p.clicks}`);
    if (typeof p.temp !== "number" || p.temp < 88 || p.temp > 96) throw new Error(`temp out of range: ${p.temp}`);
    if (!["layered", "descending", "even", "custom_even"].includes(p.pourStyle)) throw new Error(`bad pourStyle: ${p.pourStyle}`);
    if (typeof p.ratio !== "number" || p.ratio < 14 || p.ratio > 17) throw new Error(`ratio out of range: ${p.ratio}`);
    if (!["high", "medium", "low"].includes(p.confidence)) p.confidence = "medium";
    if (typeof p.rationale !== "string") p.rationale = "";
    return { ok: true, ...p };
  } catch (e) {
    return { ok: false, error: e.message, raw: text };
  }
}

async function askAdvisor({ bean, recipeKey, currentRecipe, feedbackHistory, mode, apiKey }) {
  if (!apiKey) return { ok: false, error: "No API key set. Add one in Settings." };
  if (!bean) return { ok: false, error: "No bean provided." };
  if (!["fill", "adjust", "review"].includes(mode)) return { ok: false, error: `Bad mode: ${mode}` };

  const prompt = buildAIPrompt({ bean, recipeKey, currentRecipe, feedbackHistory, mode });

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 400,
        messages: [
          { role: "user", content: prompt },
          { role: "assistant", content: "{" }
        ]
      })
    });
    if (!response.ok) {
      const err = await response.text();
      return { ok: false, error: `API ${response.status}: ${err.slice(0, 200)}` };
    }
    const data = await response.json();
    const text = data.content?.[0]?.text || "";
    return parseAIResponse("{" + text);
  } catch (e) {
    return { ok: false, error: `Network error: ${e.message}` };
  }
}

  const existing = bean.recipes?.[recipeKey];

  // fallback to smart defaults
  if (recipeKey.startsWith("v60")) {
    const sd = smartDefaultsV60(bean, recipeKey === "v60_iced" ? "iced" : "hot");

  if (recipeKey.startsWith("brikka")) {

}

// ==========================================================
// DOSE
// ==========================================================
function renderDose() {

  wrap.className = "section";
  const isV60 = state.brewType === "v60";

  state.ratio = state.ratio || 15;

  wrap.innerHTML = `
    <div class="card">
      <span class="card-label">DOSE</span>
      <div class="form-row">
        <label>Coffee weight (grams)</label>
        <input type="number" id="dose-input" value="${state.dose}" min="8" max="30" step="1">
        <div class="helper-text">Typical V60: 14–20g · Brikka: 15–16g</div>
      </div>
      ${isV60 ? `
      <div class="form-row">
        <label>Ratio (1:X water)</label>
        <div class="three-toggle" id="ratio-toggle">
          ${[14, 15, 16, 17].map(r =>
            `<button data-ratio="${r}" class="${state.ratio === r ? "selected" : ""}">1:${r}</button>`
          ).join("")}
        </div>
        <div class="helper-text">Total water will be ${state.dose * state.ratio}g</div>
      </div>` : ""}
    </div>

    <button class="btn primary" id="go-btn">◆ GENERATE RECIPE</button>
    <button class="btn ghost" data-back="1" style="margin-top: 8px;">← Back</button>
  `;

  wrap.querySelector("#dose-input").addEventListener("input", e => {
    state.dose = parseInt(e.target.value) || defaultDose;
    if (isV60) {
      const helper = wrap.querySelector(".helper-text:last-of-type");
      if (helper && helper.textContent.startsWith("Total")) {

      if (!r) return;

    });

  wrap.querySelector("#go-btn").addEventListener("click", generateRecipe);

// ==========================================================
// GENERATE RECIPE
// ==========================================================
function generateRecipe() {
  const bean = state.selectedBean;
  const recipeKey = recipeKeyFor(state.brewType, state.method);
  state.recipeKey = recipeKey;
  const result = getRecipeForBean(bean, recipeKey, state.brewType);
  if (!result) { toast("Cannot generate recipe"); return; }

  state.recipe = { ...result.recipe, ratio: state.ratio };
  state.engineMeta = {
    basis: result.basis,
    reasons: result.meta?.reasons || [],
    confidence: result.meta?.confidence || "high",
    aiInvoked: false,
    aiRationale: null
  };

  // Build pour schedule for V60
  if (state.brewType === "v60") {
    state.pourSchedule = generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle);
  }

  // Auto-invoke AI if smart_default confidence low and API key present
  if (result.basis === "smart_default" && result.meta?.confidence === "low" && state.apiKey) {
    state.aiLoading = true;
    state.screen = "recipe";
    render();
    askAdvisor({
      bean,
      recipeKey,
      currentRecipe: state.recipe,
      feedbackHistory: [],
      mode: "fill",
      apiKey: state.apiKey
    }).then(res => {
      state.aiLoading = false;
      state.aiResult = res;
      if (res.ok) {
        state.engineMeta.aiInvoked = true;
        state.engineMeta.aiRationale = res.rationale;
        // Apply AI suggestion
        state.recipe.clicks = res.clicks;
        state.recipe.temp = res.temp;
        state.recipe.pourStyle = res.pourStyle;
        state.recipe.ratio = res.ratio;
        if (state.brewType === "v60") {
          state.pourSchedule = generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle);
        }
      }
      render();
    });
    return;
  }

  state.screen = "recipe";
  render();
}

// ==========================================================
// FEEDBACK
// ==========================================================
function renderFeedback() {
  const wrap = document.createElement("div");
  const r = state.recipe;

  const card = document.createElement("div");
  card.className = "section";

  let html = `
    <div class="card">
      <span class="card-label">TASTE REPORT</span>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">How did this cup land?</p>
      <div class="feedback-grid" id="fb-grid">
        ${FEEDBACK_OPTIONS.map(o => `
          <button class="chip ${state.feedback.includes(o.id) ? "selected" : ""}" data-fb="${o.id}">${o.label}</button>
        `).join("")}
        <button class="chip perfect" data-fb="perfect">Perfect — lock recipe</button>
      </div>
  `;

  // Tasting notes verification
  if (state.selectedBean.tastingNotes?.length) {
    html += `
      <div style="margin-top: 18px;">
        <div style="font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;">Tasting notes (tap to mark)</div>
        <div class="bean-notes" id="notes-row">
          ${state.selectedBean.tastingNotes.map(n => {
            const status = state.taggedNotes[n];
            return `<span class="note-chip ${status === "achieved" ? "achieved" : status === "missed" ? "missed" : ""}" data-note="${n}">${n}</span>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  // Adjustment preview
  if (state.adjustment) {
    if (state.adjustment.type === "channeling") {
      html += `
        <div class="adjustment" style="border-left-color: var(--red-miss);">
          <div class="head" style="color: var(--red-miss);">CHANNELING DETECTED</div>
          <div class="why">${state.adjustment.diagnosis}<br><br>${state.adjustment.action}</div>
        </div>
      `;
    } else if (state.adjustment.type === "no-change") {
      html += `
        <div class="adjustment">
          <div class="head">NO CHANGE</div>
          <div class="why">${state.adjustment.diagnosis}<br><br>${state.adjustment.action || ""}</div>
        </div>
      `;
    } else if (state.adjustment.type === "adjustment") {
      const adj = state.adjustment.adjustment;
      html += `
        <div class="adjustment">
          <div class="head">PROPOSED ADJUSTMENT</div>
          <div class="change">
            Clicks <span class="arrow">${r.clicks}</span><span class="arrow">→</span><span class="new">${adj.clicks}</span>
            ${adj.temp !== null ? `<br>Temp <span class="arrow">${r.temp}°C</span><span class="arrow">→</span><span class="new">${adj.temp}°C</span>` : ""}
          </div>
          <div class="why">${state.adjustment.diagnosis}</div>
        </div>
      `;
    }
  }

  // Dev note
  html += `
    <button class="dev-note-toggle ${state.pendingDevNote ? "open" : ""}" id="dev-toggle">dev note</button>
    <div class="dev-note-area ${state.pendingDevNote ? "open" : ""}" id="dev-area">
      <textarea id="dev-note-input" placeholder="What surprised you? Was the engine off? Calibration notes..." rows="3">${state.pendingDevNote}</textarea>
    </div>
  `;

  html += `</div>`;

  // Actions
  html += `
    <div class="btn-row" style="margin-top: 14px;">
      <button class="btn" id="discard-btn">Cancel</button>
      <button class="btn primary" id="apply-btn">${state.feedback.includes("perfect") ? "Lock & save" : "Apply & save"}</button>
    </div>
  `;

  card.innerHTML = html;
  wrap.appendChild(card);

  // Feedback chip handlers
  card.querySelector("#fb-grid").addEventListener("click", e => {
    const fb = e.target.dataset.fb;
    if (!fb) return;
    if (fb === "perfect") {
      state.feedback = ["perfect"];
      state.adjustment = null;
    } else {
      state.feedback = state.feedback.filter(f => f !== "perfect");
      if (state.feedback.includes(fb)) {
        state.feedback = state.feedback.filter(f => f !== fb);
      } else {
        state.feedback.push(fb);
      }
      state.adjustment = state.feedback.length ? processFeedback({ currentRecipe: r, feedback: state.feedback }) : null;
    }
    render();
  });

  // Note tap cycle
  const notesRow = card.querySelector("#notes-row");
  if (notesRow) {
    notesRow.addEventListener("click", e => {
      const note = e.target.dataset.note;
      if (!note) return;
      const cur = state.taggedNotes[note];
      state.taggedNotes[note] = cur === "achieved" ? "missed" : cur === "missed" ? undefined : "achieved";
      render();
    });
  }

  // Dev note toggle
  card.querySelector("#dev-toggle").addEventListener("click", () => {
    const area = card.querySelector("#dev-area");
    const tog = card.querySelector("#dev-toggle");
    area.classList.toggle("open");
    tog.classList.toggle("open");
    if (area.classList.contains("open")) {
      card.querySelector("#dev-note-input").focus();
    }
  });
  card.querySelector("#dev-note-input").addEventListener("input", e => {
    state.pendingDevNote = e.target.value;
  });

  // Apply / discard
  card.querySelector("#discard-btn").addEventListener("click", () => {
    state.screen = "recipe";
    render();
  });
  card.querySelector("#apply-btn").addEventListener("click", applyFeedback);

  return wrap;
}

function applyFeedback() {
  const r = state.recipe;
  const bean = state.selectedBean;
  const isPerfect = state.feedback.includes("perfect");

  // Build history entry
  const entry = {
    id: "brew-" + Date.now(),
    date: new Date().toISOString(),
    beanId: bean.id,
    beanName: bean.name,
    recipeKey: state.recipeKey,
    dose: state.dose,
    ratio: state.ratio,
    settings: { clicks: r.clicks, temp: r.temp, pourStyle: r.pourStyle },
    feedback: state.feedback,
    notes: { ...state.taggedNotes },
    adjustment: state.adjustment?.adjustment || null,
    adjustmentApplied: state.adjustment?.type === "adjustment",
    engineMeta: state.engineMeta,
    devNote: state.pendingDevNote || null
  };
  state.history.unshift(entry);
  if (state.history.length > 100) state.history.length = 100;
  save(KEYS.history, state.history);

  // Update the bean's recipe slot
  if (isPerfect) {
    persistBeanRecipe(bean, state.recipeKey, { ...r, locked: true });
    toast("Recipe locked.");
  } else if (state.adjustment?.type === "adjustment") {
    const adj = state.adjustment.adjustment;
    persistBeanRecipe(bean, state.recipeKey, { ...r, clicks: adj.clicks, temp: adj.temp || r.temp });
    toast(`Saved: ${adj.clicks}c, ${adj.temp || r.temp}°C`);
  } else {
    toast("Saved to history.");
  }

  state.screen = "history";
  state.feedback = [];
  state.taggedNotes = {};
  state.adjustment = null;
  state.pendingDevNote = "";
  state.recipe = null;
  state.selectedBean = null;
  state.brewType = null;
  state.method = null;
  render();
}

function persistBeanRecipe(bean, recipeKey, recipe) {
  // If preset, store the customisation in customBeans as a copy
  const existing = state.customBeans.find(b => b.id === bean.id);
  if (existing) {
    existing.recipes = existing.recipes || {};
    existing.recipes[recipeKey] = recipe;
    save(KEYS.beans, state.customBeans);
  } else if (!bean.custom) {
    // Clone preset into customBeans to record the override
    const clone = JSON.parse(JSON.stringify(bean));
    clone.recipes = clone.recipes || {};
    clone.recipes[recipeKey] = recipe;
    clone.id = bean.id; // keep same id, customBeans takes precedence in findBean via PRESET fallback
    // Mark to prefer custom version: store under same id
    // Replace PRESET-matched id in state.customBeans
    state.customBeans.push(clone);
    save(KEYS.beans, state.customBeans);
  } else {
    // Already custom
    bean.recipes = bean.recipes || {};
    bean.recipes[recipeKey] = recipe;
    save(KEYS.beans, state.customBeans);
  }
}

// allBeans needs to prefer customBeans over presets when ids collide
function allBeansResolved() {
  const customIds = new Set(state.customBeans.map(b => b.id));
  const presetsFiltered = PRESETS.filter(p => !customIds.has(p.id));
  return [...presetsFiltered, ...state.customBeans];
}
// override
allBeans = allBeansResolved;

        ${h.devNote ? `<div class="dev-note">${h.devNote}</div>` : ""}
      </div>
    `;
  }
  wrap.innerHTML = html;
  return wrap;
}

// SETTINGS
// ==========================================================

  const wrap = document.createElement("div");
  wrap.className = "section";
  wrap.innerHTML = `
    <div class="card">
      <span class="card-label">ANTHROPIC API KEY</span>
      <div class="form-row">
        <input type="password" id="apikey-input" value="${state.apiKey}" placeholder="sk-ant-...">
        <div class="helper-text">Used for AI advisor (Haiku 4.5). Stored on this device only.</div>
      </div>
      <button class="btn" id="save-key">Save key</button>
    </div>

    <div class="card">
      <span class="card-label">DEV LOG</span>
      <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
        Export your brews + dev notes as markdown. Paste into chat for next-session calibration.
      </div>
      <button class="btn primary" id="export-log">◆ Copy dev log to clipboard</button>
      <button class="btn ghost" id="clear-history" style="margin-top: 8px;">Clear all history</button>
    </div>

    <div class="card">
      <span class="card-label">DEFAULTS</span>
      <div class="form-row">
        <label>V60 default dose (g)</label>
        <input type="number" id="def-v60" value="${state.settings.defaultV60Dose}" min="8" max="30">
      </div>
      <div class="form-row">
        <label>Brikka default dose (g)</label>
        <input type="number" id="def-brikka" value="${state.settings.defaultBrikkaDose}" min="10" max="20">
      </div>
      <div class="form-row">
        <label>Default ratio</label>
        <select id="def-ratio">
          ${[14, 15, 16, 17].map(r => `<option value="${r}" ${state.settings.defaultRatio === r ? "selected" : ""}>1:${r}</option>`).join("")}
        </select>
      </div>
      <button class="btn" id="save-defaults">Save defaults</button>
    </div>

    <div class="card">
      <span class="card-label">DANGER ZONE</span>
      <button class="btn danger" id="clear-all">Erase everything (beans, history, key)</button>
    </div>
  `;
  wrap.querySelector("#save-key").addEventListener("click", () => {
    state.apiKey = wrap.querySelector("#apikey-input").value.trim();
    localStorage.setItem(KEYS.apiKey, state.apiKey);
    toast("API key saved");
  });
  wrap.querySelector("#save-defaults").addEventListener("click", () => {
    state.settings.defaultV60Dose = parseInt(wrap.querySelector("#def-v60").value) || 16;
    state.settings.defaultBrikkaDose = parseInt(wrap.querySelector("#def-brikka").value) || 16;
    state.settings.defaultRatio = parseInt(wrap.querySelector("#def-ratio").value) || 15;
    save(KEYS.settings, state.settings);
    toast("Defaults saved");
  });
  wrap.querySelector("#export-log").addEventListener("click", exportDevLog);
  wrap.querySelector("#clear-history").addEventListener("click", () => {
    if (confirm("Clear all brew history?")) {
      state.history = [];
      save(KEYS.history, state.history);
      render();
      toast("History cleared");
    }
  });
  wrap.querySelector("#clear-all").addEventListener("click", () => {
    if (confirm("Erase ALL data (beans, history, API key)? Cannot undo.")) {
      Object.values(KEYS).forEach(k => localStorage.removeItem(k));
      localStorage.removeItem(KEYS.apiKey);
      location.reload();
    }
  });
  return wrap;
}

function exportDevLog() {
  const lines = [];
  lines.push(`BREW LAB DEV LOG`);
  lines.push(`Exported: ${new Date().toISOString()}`);
  lines.push(`Brews logged: ${state.history.length}`);
  lines.push(`==========================================`);
  lines.push("");
  for (const h of state.history) {
    lines.push(`# ${h.beanName} · ${h.recipeKey} · ${fmtDate(h.date)}`);
    lines.push(`Recipe: ${h.dose}g · ${h.settings.clicks} clicks · ${h.settings.temp || "—"}°C · ${h.settings.pourStyle || "—"} · 1:${h.ratio}`);
    if (h.engineMeta) {
      lines.push(`Basis: ${h.engineMeta.basis} (confidence: ${h.engineMeta.confidence})`);
      if (h.engineMeta.reasons?.length) {
        lines.push(`  Reasons:`);
        h.engineMeta.reasons.forEach(r => lines.push(`    → ${r}`));
      }
      if (h.engineMeta.aiInvoked) {
        lines.push(`  AI rationale: ${h.engineMeta.aiRationale || "—"}`);
      }
    }
    const tagged = Object.entries(h.notes || {}).filter(([k, v]) => v);
    if (tagged.length) {
      lines.push(`Tasting notes: ${tagged.map(([k, v]) => `${k}=${v}`).join(", ")}`);
    }
    lines.push(`Feedback: ${h.feedback?.length ? h.feedback.join(", ") : "—"}`);
    if (h.adjustment) {
      lines.push(`Adjustment applied: ${h.adjustment.clicks} clicks, ${h.adjustment.temp}°C`);
    }
    if (h.devNote) {
      lines.push(`DEV NOTE: ${h.devNote}`);
    }
    lines.push("");
  }
  const text = lines.join("\n");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(
      () => toast("Dev log copied!"),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); toast("Dev log copied!"); }
  catch { toast("Copy failed — try again"); }
  document.body.removeChild(ta);
}

// ADD / EDIT BEAN
// ==========================================================
function renderAddBean() {
  const wrap = document.createElement("div");
  wrap.className = "section";

  // Working draft
  if (!wrap._draft) {
    wrap._draft = {
      name: "",
      roaster: "",
      origins: [{ country: "", variety: "", process: "Washed", share: 100 }],
      roast: { level: "Medium", intent: "Filter" },
      tastingNotes: []
    };
  }
  const d = wrap._draft;

  wrap.innerHTML = `
    <div class="card">
      <span class="card-label">ADD CUSTOM BEAN</span>

      <div class="form-row">
        <label>Bean name</label>
        <input id="b-name" value="${d.name}" placeholder="e.g. Ethiopia Yirgacheffe">
      </div>
      <div class="form-row">
        <label>Roaster (optional)</label>
        <input id="b-roaster" value="${d.roaster}" placeholder="e.g. Pirates of Coffee">
      </div>

      <div class="form-row">
        <label>Origin country</label>
        <input id="b-country" value="${d.origins[0].country}" placeholder="e.g. Colombia">
      </div>
      <div class="form-row">
        <label>Variety</label>
        <input id="b-variety" value="${d.origins[0].variety}" placeholder="e.g. Castillo, Heirloom, Caturra">
      </div>
      <div class="form-row">
        <label>Process</label>
        <select id="b-process">
          ${["Washed", "Natural", "Honey", "Cofermentation", "Anaerobic", "Wet-hulled", "Experimental"].map(p =>
            `<option value="${p}" ${d.origins[0].process === p ? "selected" : ""}>${p}</option>`
          ).join("")}
        </select>
      </div>

      <div class="form-row">
        <label>Roast level</label>
        <select id="b-level">
          ${["Light", "Light-Medium", "Medium", "Medium-Dark", "Dark"].map(l =>
            `<option value="${l}" ${d.roast.level === l ? "selected" : ""}>${l}</option>`
          ).join("")}
        </select>
      </div>

      <div class="form-row">
        <label>Roast intent</label>
        <div class="three-toggle" id="b-intent">
          <button data-intent="Filter" class="${d.roast.intent === "Filter" ? "selected" : ""}">Filter</button>
          <button data-intent="Espresso" class="${d.roast.intent === "Espresso" ? "selected" : ""}">Espresso</button>
          <button data-intent="Omni" class="${d.roast.intent === "Omni" ? "selected" : ""}">Omni</button>
        </div>
        <div class="helper-text">
          <strong style="color: var(--gold);">Filter</strong>: roasted for V60 / Chemex. Standard.<br>
          <strong style="color: var(--gold);">Espresso</strong>: roasted darker for pressure. <em>More soluble on V60 — engine will go coarser + cooler.</em><br>
          <strong style="color: var(--gold);">Omni</strong>: designed for both. Treated as Filter unless context overrides.
        </div>
      </div>

      <div class="form-row">
        <label>Tasting notes (comma-separated)</label>
        <input id="b-notes" value="${d.tastingNotes.join(", ")}" placeholder="berry, lemongrass, caramel">
      </div>

      <button class="btn primary" id="save-bean">◆ Save bean</button>
      <button class="btn ghost" id="cancel-bean" style="margin-top: 8px;">Cancel</button>
    </div>
  `;

  wrap.querySelector("#b-intent").addEventListener("click", e => {
    const i = e.target.dataset.intent;
    if (!i) return;
    d.roast.intent = i;
    render();
  });

  wrap.querySelector("#save-bean").addEventListener("click", () => {
    const name = wrap.querySelector("#b-name").value.trim();
    const country = wrap.querySelector("#b-country").value.trim();
    if (!name || !country) { toast("Name and origin country required"); return; }
    const bean = {
      id: "custom-" + uid(),
      name,
      roaster: wrap.querySelector("#b-roaster").value.trim() || null,
      custom: true,
      origins: [{
        country,
        variety: wrap.querySelector("#b-variety").value.trim() || "",
        process: wrap.querySelector("#b-process").value,
        share: 100
      }],
      roast: {
        level: wrap.querySelector("#b-level").value,
        intent: d.roast.intent
      },
      tastingNotes: wrap.querySelector("#b-notes").value.split(",").map(s => s.trim()).filter(Boolean),
      recipes: { v60_hot: null, v60_iced: null, brikka: null }
    };
    state.customBeans.push(bean);
    save(KEYS.beans, state.customBeans);
    toast("Bean added");
    state.screen = "home";
    render();
  });
  wrap.querySelector("#cancel-bean").addEventListener("click", () => {
    state.screen = "home";
    render();
  });

  return wrap;
}

// ==========================================================
// VERSION TAP HANDLER (long press for dev log export shortcut)
// ==========================================================
let versionPressTimer = null;
function onVersionTap() {
  state.versionTapCount++;
  if (state.versionTapCount >= 5) {
    state.versionTapCount = 0;
    exportDevLog();
  }
  setTimeout(() => state.versionTapCount = 0, 2000);
}

// ==========================================================

// ==========================================================
render();
</script>
