<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brew Lab">
<meta name="theme-color" content="#050811">
<title>Brew Lab V3.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════
     PALETTE — INDUSTRIAL VOID // V3.9
  ═══════════════════════════════════════════════════════ */
  :root {
    /* Surfaces */
    --void:          #050811;
    --steel-deep:    #0a1320;
    --steel:         #14202e;
    --steel-light:   #1c2a3a;
    --chrome-line:   #2a3a4e;
    --chrome-strong: #3e5571;
    /* HUD readouts */
    --hud-cyan:      #00d4ff;
    --hud-cyan-dim:  #007aa3;
    --hud-glow:      #0fffff;
    /* Hazard */
    --hazard-yellow: #ffcc00;
    --hazard-strong: #ffaa00;
    /* Action */
    --neon-magenta:  #ff3da8;
    --neon-pink:     #ff77c4;
    /* Status */
    --lock-green:    #00ff88;
    --miss-red:      #ff2244;
    --toxic-green:   #66ff44;
    /* Coffee data (reserved for extraction yield display only) */
    --brew-amber:    #c8956c;
    /* Text */
    --text-bright:   #e8f0ff;
    --text-hud:      #a0c4e0;
    --text-dim:      #5a7090;
    --text-ghost:    #2e4060;
    /* Type */
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ui:   'Inter Tight', -apple-system, sans-serif;
    /* Legacy aliases — render-function inline styles stay working */
    --bg-void:      var(--void);
    --bg-shell:     var(--steel);
    --bg-raised:    var(--steel-light);
    --bg-deepest:   var(--steel-deep);
    --line-faint:   var(--chrome-line);
    --line-strong:  var(--chrome-strong);
    --text-primary: var(--text-bright);
    --text-muted:   var(--text-hud);
    --gold:         var(--hud-cyan);
    --gold-glow:    var(--hud-cyan);
    --gold-deep:    var(--hud-cyan-dim);
    --amber:        var(--hud-cyan);
    --green-lock:   var(--lock-green);
    --red-miss:     var(--miss-red);
    --blue-cool:    var(--hud-cyan);
  }

  /* ═══════════════════════════════════════════════════════
     RESET + BASE
  ═══════════════════════════════════════════════════════ */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--mono);
    background: var(--void);
    color: var(--text-bright);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; border-radius: 0; }
  input, textarea, select {
    font-family: inherit;
    background: var(--steel);
    color: var(--text-bright);
    border: 1px solid var(--chrome-strong);
    padding: 12px;
    font-size: 14px;
    width: 100%;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--hud-cyan);
    box-shadow: 0 0 0 1px rgba(0,212,255,0.2);
  }
  textarea { resize: vertical; min-height: 80px; }

  /* ═══════════════════════════════════════════════════════
     ANIMATIONS
  ═══════════════════════════════════════════════════════ */
  @keyframes ledPulse   { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @keyframes blink      { 0%,100% { opacity:0; }  45%,55% { opacity:1; } }
  @keyframes pulse      { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes cyanPulse  { 0%,100% { box-shadow:0 0 4px rgba(0,212,255,.2); } 50% { box-shadow:0 0 10px rgba(0,212,255,.5); } }
  @keyframes fadeIn     { from { opacity:0; } to { opacity:1; } }
  @keyframes entryPulse { 0% { background:rgba(0,255,136,.12); } 100% { background:transparent; } }
  @keyframes scanReveal { from { clip-path:inset(0 0 100% 0); } to { clip-path:inset(0 0 0 0); } }
  @keyframes glitchAnim {
    0%,80%,100% { transform:none; filter:none; }
    82% { transform:skewX(-3deg) scaleX(1.015); filter:hue-rotate(-25deg) saturate(2.5); }
    84% { transform:skewX(2deg); filter:hue-rotate(20deg); }
    86% { transform:skewX(-1deg); filter:saturate(1.5); }
    88% { transform:none; filter:none; }
  }
  @keyframes crtFlicker {
    0%,93%,94.5%,96%,100% { opacity:1; }
    93.5% { opacity:.92; }
    95.2% { opacity:.95; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition-duration:.01ms !important; }
  }

  /* ═══════════════════════════════════════════════════════
     CRT MODE
  ═══════════════════════════════════════════════════════ */
  body.crt { animation: crtFlicker 30s linear infinite; }
  /* scanlines */
  body.crt::before {
    content:""; position:fixed; top:0; left:0; right:0; bottom:0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px
    );
    pointer-events:none; z-index:9999;
  }
  /* vignette */
  body.crt::after {
    content:""; position:fixed; top:0; left:0; right:0; bottom:0;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none; z-index:9998;
  }

  /* ═══════════════════════════════════════════════════════
     BOOT OVERLAY
  ═══════════════════════════════════════════════════════ */
  .boot-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background: var(--void); z-index:9000;
    display:flex; align-items:center; justify-content:center;
    padding:48px 28px; cursor:pointer;
    transition: opacity .3s ease-out;
  }
  .boot-overlay.fade-out { opacity:0; pointer-events:none; }
  .boot-inner { width:100%; max-width:480px; }
  .boot-lines { font-family:var(--mono); font-size:13px; color:var(--text-dim); line-height:2; }
  .boot-line { opacity:0; transform:translateY(3px); transition:opacity .18s ease-out,transform .18s ease-out; white-space:pre; }
  .boot-line.on  { opacity:1; transform:translateY(0); }
  .boot-line.title { color:var(--hud-cyan); font-size:15px; font-weight:700; letter-spacing:.06em; text-shadow:0 0 12px rgba(0,212,255,.4); }
  .boot-line.dim { color:var(--text-ghost); }
  .boot-line.ok  { color:var(--lock-green); }
  .boot-skip { margin-top:28px; font-family:var(--mono); font-size:9px; color:var(--text-ghost); letter-spacing:.18em; text-transform:uppercase; text-align:center; animation:pulse 2s ease-in-out infinite; }

  /* ═══════════════════════════════════════════════════════
     TARGET ACQUIRED OVERLAY
  ═══════════════════════════════════════════════════════ */
  .acquired-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(5,8,17,.97); z-index:8000;
    display:flex; align-items:center; justify-content:center;
    padding:40px 28px;
    animation: glitchAnim 1.8s ease-out forwards, fadeIn .25s ease-out;
  }
  .acquired-inner { text-align:center; }
  .acquired-eyebrow { font-family:var(--mono); font-size:11px; color:var(--lock-green); letter-spacing:.35em; margin-bottom:18px; }
  .acquired-title {
    font-family:var(--mono); font-size:30px; font-weight:700;
    letter-spacing:.1em; color:var(--lock-green); margin-bottom:22px;
    text-shadow: 0 0 20px rgba(0,255,136,.5), 0 0 40px rgba(0,255,136,.2);
  }
  .acquired-data {
    font-family:var(--mono); font-size:15px;
    color:var(--text-bright); letter-spacing:.08em; line-height:2.2; margin-bottom:20px;
  }
  .acquired-data span { color:var(--hud-cyan); font-weight:600; }
  .acquired-status { font-family:var(--mono); font-size:10px; color:var(--lock-green); letter-spacing:.25em; text-transform:uppercase; }

  /* ═══════════════════════════════════════════════════════
     HUD BAR — metal bezel
  ═══════════════════════════════════════════════════════ */
  .hud-bar {
    position:sticky; top:0; z-index:10;
    background: linear-gradient(to bottom, var(--steel-light), var(--steel-deep));
    border-bottom: 1px solid var(--chrome-line);
    box-shadow: 0 2px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    display:flex; align-items:stretch;
    padding-top:env(safe-area-inset-top);
    min-height:calc(52px + env(safe-area-inset-top));
  }
  .hud-bar.locked { border-bottom-color:var(--lock-green); box-shadow:0 2px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05), 0 0 12px rgba(0,255,136,.15); }
  .hud-cell {
    display:flex; flex-direction:column; justify-content:center;
    padding:8px 10px;
    border-right:1px solid var(--chrome-line);
    overflow:hidden; flex-shrink:0;
  }
  .hud-cell:last-child { border-right:none; }
  .hud-cell.brand {
    min-width:72px; border-right:1px solid var(--chrome-strong);
    cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .hud-cell.brand:active { background:rgba(255,255,255,.04); }
  .hud-cell.hc-bean { flex:1; min-width:0; }
  .hud-cell.hc-sys  { width:84px; }
  .hud-cell.hc-status { width:88px; }
  .hud-label {
    font-family:var(--mono); font-size:7px;
    text-transform:uppercase; letter-spacing:.18em;
    color:var(--text-ghost); margin-bottom:3px; line-height:1;
  }
  .hud-value {
    font-family:var(--mono); font-size:11px;
    text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-hud); line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hud-value.brand-name { font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--hud-cyan); }
  .hud-ver { font-family:var(--mono); font-size:7px; color:var(--text-ghost); letter-spacing:.06em; line-height:1; margin-top:3px; }
  .hud-value.sv-active { color:var(--hud-cyan); text-shadow:0 0 8px rgba(0,212,255,.4); }
  .hud-value.sv-locked { color:var(--lock-green); text-shadow:0 0 8px rgba(0,255,136,.4); }
  .hud-value.sv-warn   { color:var(--hazard-yellow); }
  .hud-value.sv-nav    { color:var(--text-dim); }
  .hud-value.sv-hidden { color:var(--text-ghost); font-size:10px; }
  .hud-brand-row { display:flex; align-items:center; gap:6px; }
  /* LED status indicator */
  .status-led {
    width:5px; height:5px; border-radius:1px; flex-shrink:0;
    background:var(--hud-cyan-dim);
    animation:ledPulse 2.5s ease-in-out infinite;
  }
  .status-led.active { background:var(--hud-cyan); box-shadow:0 0 5px var(--hud-cyan); }
  .status-led.locked { background:var(--lock-green); box-shadow:0 0 5px var(--lock-green); animation:none; }
  .status-led.warn   { background:var(--hazard-yellow); box-shadow:0 0 5px var(--hazard-yellow); }
  /* blinking cursor on status cell */
  .hud-cursor {
    display:inline-block; width:5px; height:11px; margin-left:4px;
    background:var(--hud-cyan-dim); opacity:0; vertical-align:text-bottom;
    animation:blink 1.4s step-end infinite;
    flex-shrink:0;
  }
  .hud-status-row { display:flex; align-items:center; }

  /* ═══════════════════════════════════════════════════════
     SECTIONS
  ═══════════════════════════════════════════════════════ */
  .section { padding:12px 16px; }
  .section h2 {
    font-family:var(--mono); font-size:10px;
    text-transform:uppercase; letter-spacing:.15em;
    color:var(--text-dim); margin-bottom:12px;
    display:flex; align-items:center; gap:6px;
  }
  .section h2::before { content:"▸"; color:var(--hud-cyan); flex-shrink:0; }

  /* ═══════════════════════════════════════════════════════
     CARDS — inset steel panel
  ═══════════════════════════════════════════════════════ */
  .card {
    position:relative;
    border:1px solid var(--chrome-line);
    background:var(--steel);
    padding:18px 16px 16px; margin-bottom:12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), inset 0 -1px 0 rgba(0,0,0,.4);
  }
  .card.dashed   { border-style:dashed; }
  .card.ai-success { border-color:var(--hud-cyan-dim); }
  .card.ai-error   { border-color:var(--miss-red); }
  .card-label {
    position:absolute; top:-7px; left:12px;
    background:var(--void); padding:0 8px;
    font-family:var(--mono); font-size:9px;
    text-transform:uppercase; letter-spacing:.15em; color:var(--text-dim);
  }
  .card-label.gold { color:var(--hud-cyan); }
  .card-label.red  { color:var(--miss-red); }
  .card.locked { border-color:var(--lock-green); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 0 8px rgba(0,255,136,.1); }
  .card.locked .card-label { color:var(--lock-green); }
  .lock-marker { position:absolute; top:12px; right:12px; font-family:var(--mono); font-size:9px; letter-spacing:.15em; color:var(--lock-green); }
  .lock-marker::before { content:"◆ "; }

  /* ═══════════════════════════════════════════════════════
     MISSION BRIEFING
  ═══════════════════════════════════════════════════════ */
  .mission-brief {
    border:1px solid var(--chrome-line);
    border-top:2px solid var(--hud-cyan-dim);
    background:var(--steel-deep);
    padding:10px 12px;
    box-shadow: inset 0 1px 0 rgba(0,212,255,.05);
  }
  .mb-section { padding-bottom:0; }
  .mb-line { display:flex; gap:10px; padding:3px 0; font-family:var(--mono); font-size:10px; }
  .mb-key { color:var(--text-ghost); letter-spacing:.12em; text-transform:uppercase; width:72px; flex-shrink:0; }
  .mb-val { color:var(--text-dim); line-height:1.5; }
  .mb-val.threat-high { color:var(--hazard-yellow); text-shadow:0 0 6px rgba(255,204,0,.3); }

  /* ═══════════════════════════════════════════════════════
     BEAN DISPLAY
  ═══════════════════════════════════════════════════════ */
  .bean-name { font-size:18px; font-weight:600; letter-spacing:-.01em; margin-bottom:4px; color:var(--text-bright); }
  .bean-meta { font-family:var(--mono); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; }
  .bean-meta .sep { color:var(--text-ghost); margin:0 6px; }
  .bean-meta .roast-intent { color:var(--hud-cyan); font-weight:500; }
  .bean-notes { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .note-chip {
    font-family:var(--mono); font-size:10px; padding:4px 8px;
    border:1px solid var(--chrome-strong); color:var(--text-dim); letter-spacing:.05em; text-transform:uppercase;
  }
  .note-chip.achieved { color:var(--lock-green); border-color:var(--lock-green); }
  .note-chip.missed   { color:var(--miss-red);   border-color:var(--miss-red); }

  /* ═══════════════════════════════════════════════════════
     DATA GRID
  ═══════════════════════════════════════════════════════ */
  .data-grid { display:grid; grid-template-columns:1fr 1fr; margin-top:12px; border-top:1px solid var(--chrome-line); }
  .data-cell { padding:12px; border-bottom:1px solid var(--chrome-line); }
  .data-cell:nth-child(odd)  { border-right:1px solid var(--chrome-line); }
  .data-cell:last-child, .data-cell:nth-last-child(2):nth-child(odd) { border-bottom:none; }
  .data-cell .label { font-family:var(--mono); font-size:9px; text-transform:uppercase; letter-spacing:.15em; color:var(--text-ghost); margin-bottom:4px; }
  .data-cell .value { font-family:var(--mono); font-size:20px; font-weight:500; color:var(--text-bright); }
  .data-cell .value.large { font-size:26px; font-weight:600; }
  .data-cell .value .unit { font-size:11px; color:var(--text-dim); margin-left:3px; font-weight:400; }

  /* ═══════════════════════════════════════════════════════
     POUR TIMELINE
  ═══════════════════════════════════════════════════════ */
  .pour-timeline { margin-top:6px; }
  .pour-step { display:grid; grid-template-columns:60px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid var(--chrome-line); position:relative; }
  .pour-step:last-child { border-bottom:none; }
  .pour-step::before { content:""; position:absolute; left:50px; top:0; bottom:0; width:1px; background:var(--chrome-strong); }
  .pour-step::after {
    content:""; position:absolute; left:47px; top:16px; width:7px; height:7px;
    border:1px solid var(--hud-cyan); background:var(--steel);
    transform:rotate(45deg);
    box-shadow:0 0 5px rgba(0,212,255,.35);
  }
  .pour-step .time   { font-family:var(--mono); font-size:12px; color:var(--hud-cyan); font-weight:500; }
  .pour-step .weight { font-family:var(--mono); font-size:14px; font-weight:500; margin-bottom:2px; color:var(--text-bright); }
  .pour-step .instr  { font-size:12px; color:var(--text-dim); font-family:var(--ui); }

  /* ═══════════════════════════════════════════════════════
     BUTTONS
  ═══════════════════════════════════════════════════════ */
  .btn {
    min-height:48px; padding:12px 16px;
    background:transparent; border:1px solid var(--chrome-strong);
    color:var(--text-hud);
    font-family:var(--mono); font-size:11px;
    text-transform:uppercase; letter-spacing:.1em;
    display:inline-flex; align-items:center; justify-content:center;
    gap:6px; width:100%;
    transition: border-color .12s ease-out, color .12s ease-out, background .1s ease-out;
  }
  .btn:active { background:var(--steel-light); }
  .btn.primary {
    border-color:var(--neon-magenta); color:var(--neon-magenta);
    box-shadow:0 0 8px rgba(255,61,168,.15);
  }
  .btn.primary:active { background:var(--neon-magenta); color:var(--void); box-shadow:none; }
  .btn.danger  { border-color:var(--miss-red); color:var(--miss-red); }
  .btn.danger:active { background:var(--miss-red); color:var(--void); }
  .btn.ghost   { border-color:var(--chrome-line); color:var(--text-dim); }
  .btn.ghost:active { border-color:var(--chrome-strong); }
  /* hazard-style for BURN ARCHIVE */
  .btn.burn {
    border-color:var(--miss-red); color:var(--hazard-yellow);
    box-shadow: inset 0 0 0 1px var(--miss-red), 0 0 6px rgba(255,34,68,.2);
  }
  .btn.burn:active { background:var(--miss-red); color:var(--void); }
  /* AI ready glow */
  .btn.ai-ready {
    border-color:var(--toxic-green); color:var(--toxic-green);
    box-shadow:0 0 6px rgba(102,255,68,.15);
  }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .btn-row.three { grid-template-columns:repeat(3,1fr); }
  .btn-stack > .btn { margin-bottom:8px; }
  .btn-stack > .btn:last-child { margin-bottom:0; }

  /* Protocol-select buttons */
  .btn.protocol {
    height:82px; flex-direction:column; align-items:flex-start;
    justify-content:center; gap:5px; padding:14px 18px;
    border-color:var(--chrome-strong); background:var(--steel);
    position:relative; overflow:hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn.protocol::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--hud-cyan); }
  .btn.protocol:active  { border-color:var(--hud-cyan); background:var(--steel-light); }
  .proto-name { font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--text-bright); text-align:left; }
  .proto-sub  { font-family:var(--mono); font-size:9px; font-weight:400; letter-spacing:.12em; color:var(--text-dim); text-align:left; }

  /* Method-select buttons */
  .btn.method-btn {
    height:72px; flex-direction:column; align-items:flex-start;
    justify-content:center; gap:4px; padding:12px 16px;
    border-color:var(--chrome-strong); background:var(--steel);
    position:relative; overflow:hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
  }
  .btn.method-btn::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--hud-cyan-dim); }
  .btn.method-btn:active  { border-color:var(--hud-cyan); background:var(--steel-light); }
  .method-name { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.08em; color:var(--hud-cyan); text-align:left; }
  .method-sub  { font-family:var(--mono); font-size:9px; font-weight:400; letter-spacing:.1em; color:var(--text-dim); text-align:left; }

  /* ═══════════════════════════════════════════════════════
     CHIPS — LED panel style
  ═══════════════════════════════════════════════════════ */
  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    padding:10px 14px; border:1px solid var(--chrome-line); background:var(--steel);
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em;

<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

<script>
"use strict";


// ==========================================================
// ==========================================================
// SOUND ENGINE — V3.9 // multi-layer synthesis, distortion + reverb
// ==========================================================
const SoundEngine = (() => {
  let ctx = null, master = null;
  let _enabled = localStorage.getItem("bl_sound_enabled") === "true";
  let _rvBufs = {}; // cached reverb impulse buffers

  function _init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.25;
      master.connect(ctx.destination);
    } catch(e) { ctx = null; }
  }

  // tube distortion WaveShaperNode
  function _dist(amount) {
    const ws = ctx.createWaveShaper();
    const k = amount || 50, n = 44100, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + k) * x * 20 * Math.PI / 180) / (Math.PI + k * Math.abs(x));
    }
    ws.curve = curve; ws.oversample = "4x"; return ws;
  }

  // synthesised reverb impulse (buffer cached by key)
  function _rvBuf(dur, dec) {
    const key = `${dur}_${dec}`;
    if (_rvBufs[key]) return _rvBufs[key];
    const len = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, dec);
    }
    return (_rvBufs[key] = buf);
  }

  // 3 detuned oscillators → optional dist → optional reverb → master
  function _fat({ freq, type, dur, gain, det, distort, revDur, revDecay, slideTo, t0 }) {
    if (!ctx || !_enabled) return;
    try {
      const now = ctx.currentTime + (t0 || 0) / 1000, g3 = (gain || 0.3) / 3;
      let end = master;
      if (revDur) { const c = ctx.createConvolver(); c.buffer = _rvBuf(revDur, revDecay || 2); c.connect(master); end = c; }
      if (distort) { const d = _dist(distort); d.connect(end); end = d; }
      [0, -(det || 7), (det || 7)].forEach(dv => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || "sine"; o.frequency.value = freq; o.detune.value = dv;
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(g3, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o.connect(g); g.connect(end); o.start(now); o.stop(now + dur + 0.05);
      });
    } catch(e) {}
  }

  // sub-bass sine thump
  function _sub({ freq, dur, gain, t0 }) {
    if (!ctx || !_enabled) return;
    try {
      const now = ctx.currentTime + (t0 || 0) / 1000;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(gain || 0.4, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + 0.05);
    } catch(e) {}
  }

  // filtered noise burst, optional grit
  function _n(dur, gainVal, lpFreq, t0, grit) {
    if (!ctx || !_enabled) return;
    try {
      const now = ctx.currentTime + (t0 || 0) / 1000, sr = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.floor(sr * dur), sr);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = buf; flt.type = "lowpass"; flt.frequency.value = lpFreq || 2000;
      g.gain.setValueAtTime(gainVal || 0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(flt); flt.connect(g);
      if (grit) { const dist = _dist(grit); g.connect(dist); dist.connect(master); }
      else g.connect(master);
      src.start(now); src.stop(now + dur + 0.01);
    } catch(e) {}
  }

  const _at = (ms, fn) => setTimeout(fn, ms);
  const _rm = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  return {
    unlock() { _init(); if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {}); },
    setEnabled(v) { _enabled = !!v; localStorage.setItem("bl_sound_enabled", _enabled ? "true" : "false"); },
    isEnabled() { return _enabled; },

    tap() {
      if (!_enabled || !ctx) return;
      _fat({ freq:1200, type:"square",   dur:0.04, gain:0.18, det:3,  distort:20 });
      _n(0.02, 0.1, 4000, 0, 0);
    },

    engage() {
      if (!_enabled || !ctx) return;
      _fat({ freq:220, type:"sawtooth", dur:0.2, gain:0.35, det:7, distort:30, revDur:0.3, revDecay:2, slideTo:660 });
      _sub({ freq:80, dur:0.25, gain:0.3 });
      _at(80, ()=>_fat({ freq:880, type:"triangle", dur:0.1, gain:0.25, distort:20, revDur:0.3, revDecay:2 }));
    },

    targetAcquired() {
      if (!_enabled || !ctx) return;

const ORIGIN_DENSITY = {
  Kenya: 0.85, Colombia: 0.75, Ethiopia: 0.70, Guatemala: 0.70,
  "Costa Rica": 0.70, "El Salvador": 0.65, Rwanda: 0.65, Burundi: 0.65,
  Honduras: 0.60, Mexico: 0.60, Peru: 0.60, Brazil: 0.50,
  India: 0.45, Indonesia: 0.40, Sumatra: 0.35, Malaysia: 0.30,
  Vietnam: 0.30, PNG: 0.55, "Papua New Guinea": 0.55
};
const PROCESS_SOLUBILITY = {
  Washed: 0.40, Honey: 0.55, Natural: 0.70,
  Cofermentation: 0.75, Anaerobic: 0.80, "Wet-hulled": 0.65, Experimental: 0.75
};
const FRUITY_ORIGINS = ["Kenya", "Ethiopia", "Burundi", "Rwanda"];
const CHOCOLATE_ORIGINS = ["Brazil", "Mexico", "Peru", "Honduras"];

function weightedOriginProfile(origins) {
  if (!origins || origins.length === 0) {
    return { density: 0.6, solubility: 0.5, fruity: false, chocolate: false, delicate: false };
  }
  const total = origins.reduce((s, o) => s + (o.share || 0), 0) || 1;
  let density = 0, solubility = 0;
  let fruity = false, chocolate = false, delicate = false;
  for (const o of origins) {
    const w = (o.share || 0) / total;
    density += w * (ORIGIN_DENSITY[o.country] ?? 0.6);
    solubility += w * (PROCESS_SOLUBILITY[o.process] ?? 0.5);
    if (FRUITY_ORIGINS.includes(o.country)) fruity = true;
    if (CHOCOLATE_ORIGINS.includes(o.country)) chocolate = true;
    if (o.process === "Cofermentation" || o.process === "Anaerobic") delicate = true;
  }
  return { density, solubility, fruity, chocolate, delicate };
}

// ENGINE: Smart Defaults
// ==========================================================
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function smartDefaultsV60(bean, brewType) {
  const { roast = {}, tastingNotes = [], origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 24, temp = 92, pourStyle = "layered";
  const reasons = [], signals = [];

  if (profile.density > 0.7) { clicks -= 2; temp += 1; reasons.push("dense origin → finer + warmer"); signals.push("dense"); }
  if (profile.density < 0.4) { clicks += 2; temp -= 1; pourStyle = "even"; reasons.push("porous origin → coarser + cooler"); signals.push("porous"); }
  if (profile.fruity) { clicks -= 1; temp -= 1; pourStyle = "descending"; reasons.push("fruity origin → descending pour, gentle temp"); signals.push("fruity"); }
  if (profile.chocolate && !profile.fruity) { temp += 1; pourStyle = pourStyle === "layered" ? "even" : pourStyle; reasons.push("chocolate-leaning → integration pour"); signals.push("chocolate"); }
  if (profile.delicate) { clicks += 2; temp -= 1; if (pourStyle === "layered") pourStyle = "descending"; reasons.push("delicate/porous process → coarser + cooler"); signals.push("delicate"); }
  if (origins.some(o => o.process === "Wet-hulled")) { clicks += 1; reasons.push("wet-hulled → +1 click for porosity"); signals.push("wet-hulled"); }
  if (origins.some(o => /liberica/i.test(o.variety || ""))) { clicks -= 2; temp -= 1; pourStyle = "even"; reasons.push("liberica species → counter-balance porous"); signals.push("liberica"); }

  if (roast.intent === "Espresso") {
    clicks += 2; temp -= 1; pourStyle = "even";
    reasons.push("espresso roast → more soluble, coarser + cooler, integrate");
    signals.push("espresso");
  }

  if (/dark/i.test(roast.level || "")) { clicks += 1; temp -= 1; reasons.push("dark roast → coarser, cooler"); }
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") { temp += 1; reasons.push("light filter → develop with heat"); }

  if (brewType === "iced") {
    if (signals.includes("fruity") || signals.includes("delicate")) { clicks += 1; reasons.push("iced + fragile → +1 click"); }
    if (pourStyle === "layered") pourStyle = "descending";
  }

  const fragile = /jasmine|lemongrass|osmanthus|bergamot|elderflower|peach|lychee/i;
  if (tastingNotes.some(n => fragile.test(n))) { temp = Math.min(temp, 91); reasons.push("fragile aromatics → cap temp at 91°C"); }

  let confidence = "medium";
  if (signals.length >= 3) confidence = "high";
  if (origins.length >= 3) confidence = "low";
  if (!roast.intent || roast.intent === "Omni") { if (confidence === "high") confidence = "medium"; }

  return { clicks: clamp(clicks, 12, 26), temp: clamp(temp, 88, 96), pourStyle, ratio: 15, locked: false, confidence, reasons, signals };
}

function smartDefaultsBrikka(bean) {
  const { roast = {}, origins = [] } = bean;
  const profile = weightedOriginProfile(origins);
  let clicks = 13, baseWaterTemp = "boiling";
  let icedStyle = "straight", hybridHotMl = 70;
  const reasons = [];
  if (/^light\b/i.test(roast.level || "") && roast.intent !== "Espresso") {
    clicks = 14; baseWaterTemp = "95C-cool-30s"; icedStyle = "hybrid"; hybridHotMl = 100;
    reasons.push("light filter → finer + cooler base, hybrid iced style");
  }
  if (profile.density < 0.4) { clicks = 14; reasons.push("porous → finer"); }
  if (origins.some(o => /sarchimor|parainema|catimor/i.test(o.variety || ""))) { clicks = 13; reasons.push("robusta heritage variety → standard"); }
  return { clicks, baseWaterTemp, drinkStyle: "neat", icedStyle, hybridHotMl, locked: false, confidence: "high", reasons };
}

// ENGINE: Pour Schedules
// ==========================================================
function roundTo(n, step = 5) { return Math.round(n / step) * step; }
function pourCount(dose) { if (dose <= 12) return 3; if (dose <= 18) return 4; return 5; }
function bloomG(dose) { return roundTo(dose * 2.5, 5); }

function buildLayered(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = bloomG(dose); const pours = pourCount(dose); const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.4, 0.35, 0.25] : [0.32, 0.28, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5); running += add;
    steps.push({ t, add, running, instr: i === 0 ? "Concentric circles, center-out." : "Continue. Thin steady stream." });
    t += pours <= 3 ? 30 : 25;
  });
  const last = steps[steps.length - 1]; last.add += total - last.running; last.running = total;
  return { steps, total, drawdown: t + 30, iced };
}
function buildDescending(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = roundTo(dose * (iced ? 2.5 : 3), 5); const pours = pourCount(dose); const remaining = total - bloom;
  const weights = pours === 3 ? [0.6, 0.4] : pours === 4 ? [0.42, 0.32, 0.26] : [0.34, 0.26, 0.22, 0.18];
  const steps = [{ t: 0, add: bloom, running: bloom, instr: iced ? "Bloom. Gentle spiral, swirl. Bloom is smaller for iced." : "Big bloom. Spiral, swirl firmly." }];
  let running = bloom, t = 50;
  weights.forEach((w, i) => {
    const add = roundTo(remaining * w, 5); running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pour. Wide spiral, fruit-forward." : i === weights.length - 1 ? "Finishing pour. Thin stream, hold the center." : "Tighter spiral, slow flow." });
    t += 30;
  });
  const last = steps[steps.length - 1]; last.add += total - last.running; last.running = total;
  return { steps, total, drawdown: t + 30, iced };
}
function buildEven(dose, ratio, iced) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const bloom = bloomG(dose); const pours = pourCount(dose);
  const remaining = total - bloom; const each = roundTo(remaining / (pours - 1), 5);
  const steps = [{ t: 0, add: bloom, running: bloom, instr: "Bloom. Gentle spiral, swirl." }];
  let running = bloom, t = 45;
  for (let i = 0; i < pours - 1; i++) {
    const add = i === pours - 2 ? total - running : each; running += add;
    steps.push({ t, add, running, instr: `Equal pour ${i + 1}. Steady concentric pour.` }); t += 25;
  }
  return { steps, total, drawdown: t + 30, iced };
}
function buildCustomEven(dose, ratio, iced, pulseG = 26) {
  const total = roundTo(dose * ratio * (iced ? 0.5 : 1), 5);
  const count = Math.ceil(total / pulseG); const each = roundTo(total / count, 5);
  const steps = []; let running = 0, t = 0;
  for (let i = 0; i < count; i++) {
    const add = i === count - 1 ? total - running : each; running += add;
    steps.push({ t, add, running, instr: i === 0 ? "First pulse. Saturate fully." : `Pulse ${i + 1}. Same volume, same rhythm.` }); t += 25;
  }
  return { steps, total, drawdown: t + 30, iced };
}
function generatePourSchedule(dose, ratio, pourStyle, iced = false) {
  switch (pourStyle) {
    case "descending":  return buildDescending(dose, ratio, iced);
    case "even":        return buildEven(dose, ratio, iced);
    case "custom_even": return buildCustomEven(dose, ratio, iced);
    default:            return buildLayered(dose, ratio, iced);
  }
}
function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

const FEEDBACK_RULES_BRIKKA = {

  bitter:         { clicks: +1, note: "Overextracted — coarser, pull off at first sputter" },

  "too-acidic":   { clicks: +1, note: "Brikka can't add heat — coarsen 1 click for sweeter pull, or extend brew slightly" },
  "flat-muddy":   { clicks: +1, note: "Pulled too long — coarser, pull at first sputter not full sputter" },
  "missing-notes":{ clicks: -1, note: "Aromatics need more contact — finer grind, ensure no channelling" }
};
const CHANNELING_PAIRS = [["sour", "bitter"], ["sour", "acrid"]];
const FEEDBACK_OPTIONS = [
  { id: "sour",          label: "Sour" },
  { id: "bitter",        label: "Bitter" },
  { id: "acrid",         label: "Acrid" },
  { id: "thin",          label: "Thin" },
  { id: "too-acidic",    label: "Too acidic" },
  { id: "flat-muddy",    label: "Flat / muddy" },
  { id: "missing-notes", label: "Missing notes" }
];

function processFeedback({ currentRecipe, feedback, recipeKey }) {
  const isBrikka = recipeKey && recipeKey.startsWith("brikka");
  const rules = isBrikka ? FEEDBACK_RULES_BRIKKA : FEEDBACK_RULES_V60;
  const maxClicks = isBrikka ? 15 : 26; const minClicks = 12;
  for (const [a, b] of CHANNELING_PAIRS) {
    if (feedback.includes(a) && feedback.includes(b)) {
      return {
        type: "channeling",
        diagnosis: isBrikka
          ? "Sour + bitter on Brikka = channeling. Coffee bed isn't sealing — level grounds (no tamping), check basket isn't overfilled, ensure top half is screwed firm."
          : "Sour + bitter together = channeling. Bed prep issue, not grind or temp.",
        action: isBrikka
          ? "Same clicks. Re-pour at level fill, no tamping, swirl basket gently before assembly."
          : "Try: wet WDT, level bed, slower bloom. Same settings.",
        adjustment: null
      };
    }
  }
  let clicksDelta = 0, tempDelta = 0; const reasons = [];
  for (const f of feedback) {
    const rule = rules[f]; if (!rule) continue;
    clicksDelta += rule.clicks;
    if (!isBrikka) tempDelta += rule.temp || 0;
    reasons.push(rule.note);
  }
  if (clicksDelta === 0 && (isBrikka || tempDelta === 0)) {
    return { type: "no-change", diagnosis: "Feedback signals cancel. No clear direction.", action: "Re-brew same settings, focus technique.", adjustment: null };
  }
  clicksDelta = clamp(clicksDelta, isBrikka ? -1 : -2, isBrikka ? 1 : 2);
  tempDelta = clamp(tempDelta, -2, 2);
  const adjustment = {
    clicks: clamp(currentRecipe.clicks + clicksDelta, minClicks, maxClicks),
    temp: (!isBrikka && currentRecipe.temp) ? clamp(currentRecipe.temp + tempDelta, 88, 96) : null
  };
  return { type: "adjustment", diagnosis: reasons.join(". "), adjustment, delta: { clicks: clicksDelta, temp: tempDelta } };
}

function parseAIResponse(text, recipeKey) {
  let cleaned = text.replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("{"), end = cleaned.lastIndexOf("}");
  if (start >= 0 && end > start) cleaned = cleaned.slice(start, end + 1);
  try {
    const p = JSON.parse(cleaned);
    const isBrikka = recipeKey && recipeKey.startsWith("brikka");
    if (typeof p.ratio === "string") { const m = p.ratio.match(/(\d+)\s*$/); if (m) p.ratio = parseInt(m[1]); }
    if (typeof p.clicks === "string") p.clicks = parseInt(p.clicks);
    if (typeof p.temp === "string") p.temp = parseInt(p.temp);
    const minClicks = isBrikka ? 11 : 12, maxClicks = isBrikka ? 16 : 26;
    if (typeof p.clicks !== "number" || isNaN(p.clicks) || p.clicks < minClicks || p.clicks > maxClicks) throw new Error(`clicks out of range: ${p.clicks}`);
    if (!isBrikka) {
      if (typeof p.temp !== "number" || isNaN(p.temp) || p.temp < 88 || p.temp > 96) throw new Error(`temp out of range: ${p.temp}`);
      if (!["layered","descending","even","custom_even"].includes(p.pourStyle)) throw new Error(`bad pourStyle: ${p.pourStyle}`);
      if (typeof p.ratio !== "number" || isNaN(p.ratio) || p.ratio < 14 || p.ratio > 17) throw new Error(`ratio out of range: ${p.ratio}`);
    } else {
      if (typeof p.temp !== "number" || isNaN(p.temp)) p.temp = null;
      if (typeof p.ratio !== "number" || isNaN(p.ratio)) p.ratio = null;
      if (!["layered","descending","even","custom_even"].includes(p.pourStyle)) p.pourStyle = null;
    }
    if (!["high","medium","low"].includes(p.confidence)) p.confidence = "medium";
    if (typeof p.rationale !== "string") p.rationale = "";
    return { ok: true, ...p };
  } catch (e) { return { ok: false, error: e.message, raw: text }; }
}

async function askAdvisor({ bean, recipeKey, currentRecipe, feedbackHistory, mode, apiKey }) {
  if (!apiKey) return { ok: false, error: "No API key set. Add one in Settings." };
  if (!bean)   return { ok: false, error: "No bean provided." };
  if (!["fill","adjust","review"].includes(mode)) return { ok: false, error: `Bad mode: ${mode}` };
  const prompt = buildAIPrompt({ bean, recipeKey, currentRecipe, feedbackHistory, mode });
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-haiku-4-5-20251001", max_tokens: 400, messages: [{ role:"user", content:prompt }, { role:"assistant", content:"{" }] })
    });
    if (!response.ok) { const err = await response.text(); return { ok: false, error: `API ${response.status}: ${err.slice(0, 200)}` }; }
    const data = await response.json();
    return parseAIResponse("{" + (data.content?.[0]?.text || ""), recipeKey);
  } catch (e) { return { ok: false, error: `Network error: ${e.message}` }; }
}

  const existing = bean.recipes?.[recipeKey];
  if (existing) return { recipe: existing, basis: "preset", meta: null };

  return null;
}

function generateMissionBriefing(bean, recipe, engineMeta, brewType) {
  let threat = "No active threats identified.", threatHigh = false;
  if (engineMeta?.reasons?.length) {
    const r = engineMeta.reasons;
    if (r.some(x => /espresso roast/i.test(x)))       { threat = "Espresso roast on pour-over — high solubility; corpse water risk if dialed tight"; threatHigh = true; }
    else if (r.some(x => /fragile aromatics/i.test(x))){ threat = "Fragile aromatics active — ash risk above 91°C"; threatHigh = true; }
    else if (r.some(x => /fruity/i.test(x)))            { threat = "Fruity origin — acidity pull risk if extraction overruns"; threatHigh = true; }
    else if (r.some(x => /delicate/i.test(x)))          { threat = "Delicate process — porous structure, narrow window"; }
    else if (r.some(x => /dark roast/i.test(x)))        { threat = "Dark roast — low extraction ceiling, ash onset fast"; threatHigh = true; }
    else if (r.some(x => /porous/i.test(x)))            { threat = "Porous origin — channeling risk at fine grind settings"; }
    else if (r.some(x => /dense/i.test(x)))             { threat = "Dense origin — high potential, rewards fine grind"; }
    else if (r.some(x => /chocolate/i.test(x)))         { threat = "Chocolate-forward — integration pour required for body"; }
    else                                                 { threat = r[0]; }
  } else if (recipe.locked)                             { threat = "Protocol dialed — all clear. Execute."; }
  else if (engineMeta?.basis === "preset")              { threat = "Preset protocol loaded — engine calibrated for this bean."; }

  const isBrikka = brewType === "brikka";
  const minC = Math.max(isBrikka ? 12 : 12, (recipe.clicks || 24) - 1);
  const maxC = Math.min(isBrikka ? 15 : 26, (recipe.clicks || 24) + 1);
  let killZone = `${minC}–${maxC} clicks`;
  if (recipe.temp) killZone += ` · ${Math.max(88, recipe.temp - 1)}–${Math.min(96, recipe.temp + 1)}°C`;

  return { threat, killZone, threatHigh };
}

function bootSequence(onComplete) {
  if (state.settings.skipBoot || sessionStorage.getItem("bl_booted")) { onComplete(); return; }
  sessionStorage.setItem("bl_booted", "1");

  const beanCount = allBeans().length, histCount = state.history.length;
  const lines = [
    { text:"BREW LAB V3.9 // PHANTOM TRIAL", cls:"title" },
    { text:"─────────────────────────────────────", cls:"dim" },
    { text:"" },
    { text:`> INIT EXTRACTION ENGINE............  `, ok:"OK" },
    { text:`> LOAD ORIGIN PROFILES..............  `, ok:"OK" },
    { text:`> LOAD BEAN ARCHIVE.................  `, ok:`OK  [${beanCount} ENTRIES]` },
    { text:`> LOAD ARCHIVE......................  `, ok:`OK  [${histCount} PROTOCOLS]` },
    { text:`> CALIBRATE DOSE ENGINE.............  `, ok:"OK" },
    { text:`> PHANTOM TRIAL MODE................  `, ok:"ACTIVE" },
    { text:"" },
    { text:"> STANDING BY.", cls:"ok" }
  ];

  const overlay = document.createElement("div");
  overlay.className = "boot-overlay";
  overlay.innerHTML = `<div class="boot-inner"><div class="boot-lines" id="bl-lines"></div><div class="boot-skip">TAP TO SKIP</div></div>`;
  document.body.appendChild(overlay);
  const linesEl = overlay.querySelector("#bl-lines");

  const skip = () => {
    overlay.classList.add("fade-out");
    setTimeout(() => { overlay.remove(); onComplete(); }, 300);
  };
  overlay.addEventListener("click", skip);

  let i = 0;
  function tick() {
    if (i >= lines.length) { setTimeout(skip, 500); return; }
    const { text, cls, ok } = lines[i++];
    const el = document.createElement("div");
    el.className = "boot-line" + (cls ? " " + cls : "");
    if (ok) {
      el.innerHTML = text + `<span style="color:var(--lock-green)">${ok}</span>`;
    } else {
      el.textContent = text;
    }
    linesEl.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    setTimeout(tick, text === "" ? 60 : 100);
  }
  tick();
}

function renderStatusBar() {
  const el = document.createElement("div");
  el.className = "hud-bar";

  let statusText = "STANDBY", statusClass = "", ledClass = "";
  if (state.recipe?.locked)             { statusText="DIALED";    statusClass="sv-locked"; ledClass="locked"; el.classList.add("locked"); }
  else if (state.recipe)                { statusText="ACTIVE";    statusClass="sv-active"; ledClass="active"; }
  else if (state.aiLoading)             { statusText="COMPILING"; statusClass="sv-active"; ledClass="active"; }
  else if (state.screen==="history")    { statusText="ARCHIVE";   statusClass="sv-nav"; }
  else if (state.screen==="settings")   { statusText="SYSTEM";    statusClass="sv-nav"; }
  else if (state.screen==="addBean")    { statusText="REGISTER";  statusClass="sv-nav"; }
  else if (state.screen==="voidlog")    { statusText="VOID.LOG";  statusClass="sv-hidden"; }

  const isIdle = state.screen==="home" && !state.selectedBean;
  let beanLabel="BEAN", beanVal="—", sysLabel="PROTOCOL", sysVal="—";
  if (isIdle) {
    beanLabel="OPERATOR"; beanVal="LOADOUT"; sysLabel="GEAR"; sysVal="C40 · V60";
  } else if (state.selectedBean) {
    const raw = state.selectedBean.name.toUpperCase();
    beanVal = raw.length > 16 ? raw.slice(0, 14) + "…" : raw;
    if (state.brewType && state.method) sysVal = `${state.brewType.toUpperCase()} ${state.method.replace("_"," ").toUpperCase()}`;
    else if (state.brewType) sysVal = state.brewType.toUpperCase();
  }

  el.innerHTML = `
    <div class="hud-cell brand" id="version-tap">
      <div class="hud-brand-row">
        <div class="status-led ${ledClass}"></div>
        <div class="hud-value brand-name">BREW LAB</div>
      </div>
      <div class="hud-ver">V3.9 // PHANTOM</div>
    </div>
    <div class="hud-cell hc-bean">
      <div class="hud-label">${beanLabel}</div>
      <div class="hud-value">${beanVal}</div>
    </div>
    <div class="hud-cell hc-sys">
      <div class="hud-label">${sysLabel}</div>
      <div class="hud-value">${sysVal}</div>
    </div>
    <div class="hud-cell hc-status">
      <div class="hud-label">STATUS</div>
      <div class="hud-status-row">
        <div class="hud-value ${statusClass}">◆ ${statusText}</div>
        <span class="hud-cursor"></span>
      </div>
    </div>`;

  // long-press (650ms) → VOID.LOG screen  |  short tap → 5-tap counter
  const brand = el.querySelector("#version-tap");
  let lpTimer = null, lpFired = false;
  brand.addEventListener("touchstart", () => { lpFired=false; lpTimer=setTimeout(() => { lpFired=true; state.screen="voidlog"; render(); }, 650); }, { passive:true });
  brand.addEventListener("touchend",   () => { clearTimeout(lpTimer); lpTimer=null; });
  brand.addEventListener("touchmove",  () => { clearTimeout(lpTimer); lpTimer=null; }, { passive:true });
  brand.addEventListener("click",      () => { if (!lpFired) onVersionTap(); lpFired=false; });

  // 10-tap LED → Duke easter egg
  const led = el.querySelector(".status-led");
  if (led) {
    led.addEventListener("click", e => {
      e.stopPropagation();
      state.dukeTaps = (state.dukeTaps || 0) + 1;
      clearTimeout(state.dukeResetTimer);
      if (state.dukeTaps >= 10) {
        state.dukeTaps = 0;
        SoundEngine.dukeHail();
        state.dukeQuoteIdx = Math.floor(Math.random() * DUKE_QUOTES.length);
        state.screen = "duke"; render(); return;
      }
      state.dukeResetTimer = setTimeout(() => { state.dukeTaps = 0; }, 1500);
    });
  }

  return el;
}

    const m = e.target.closest("[data-method]")?.dataset.method; if (!m) return;

}

  });
  if (isV60) wrap.querySelector("#ratio-toggle").addEventListener("click", e => { const r=parseInt(e.target.dataset.ratio); if (!r) return; state.ratio=r; render(); });
  wrap.querySelector("#go-btn").addEventListener("click", generateRecipe);
  wrap.querySelector("[data-back]").addEventListener("click", () => { state.screen="bean"; render(); });

// ==========================================================
// GENERATE RECIPE
// ==========================================================
function generateRecipe() {
  const bean=state.selectedBean, recipeKey=recipeKeyFor(state.brewType, state.method);
  state.recipeKey=recipeKey;
  const result=getRecipeForBean(bean, recipeKey, state.brewType);
  if (!result) { toast("Cannot generate recipe"); SoundEngine.denied(); return; }
  state.recipe={...result.recipe, ratio:state.ratio};
  state.engineMeta={ basis:result.basis, reasons:result.meta?.reasons||[], confidence:result.meta?.confidence||"high", aiInvoked:false, aiRationale:null };
  if (state.brewType==="v60") state.pourSchedule=generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle, state.method==="iced");
  SoundEngine.engage();
  if (result.basis==="smart_default" && result.meta?.confidence==="low" && state.apiKey) {
    state.aiLoading=true; state.screen="recipe"; render();
    askAdvisor({ bean, recipeKey, currentRecipe:state.recipe, feedbackHistory:[], mode:"fill", apiKey:state.apiKey })
      .then(res => {
        state.aiLoading=false; state.aiResult=res;
        if (res.ok) {
          state.engineMeta.aiInvoked=true; state.engineMeta.aiRationale=res.rationale;
          state.recipe.clicks=res.clicks; state.recipe.temp=res.temp;
          state.recipe.pourStyle=res.pourStyle; state.recipe.ratio=res.ratio;
          if (state.brewType==="v60") state.pourSchedule=generatePourSchedule(state.dose, state.ratio, state.recipe.pourStyle, state.method==="iced");
        }
        render();
      });
    return;
  }
  state.screen="recipe"; render();
}

// ==========================================================
// FEEDBACK
// ==========================================================
function renderFeedback() {
  const wrap=document.createElement("div"), r=state.recipe;
  const card=document.createElement("div"); card.className="section";

  let html=`<div class="card"><span class="card-label">THREAT ASSESSMENT</span>
    <p style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">Assess this extraction:</p>
    <div class="feedback-grid" id="fb-grid">
      ${FEEDBACK_OPTIONS.map(o=>`<button class="chip${state.feedback.includes(o.id)?" selected":""}" data-fb="${o.id}">${o.label}</button>`).join("")}
      <button class="chip perfect" data-fb="perfect">◆ KILL ZONE — LOCK PROTOCOL</button>
    </div>`;

  if (state.selectedBean.tastingNotes?.length) {
    html+=`<div style="margin-top:18px;">
      <div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Tasting notes (tap to mark)</div>
      <div class="bean-notes" id="notes-row">
        ${state.selectedBean.tastingNotes.map(n=>{const s=state.taggedNotes[n];return `<span class="note-chip${s==="achieved"?" achieved":s==="missed"?" missed":""}" data-note="${n}">${n}</span>`;}).join("")}
      </div></div>`;
  }

  if (state.adjustment) {
    if (state.adjustment.type==="channeling") {
      html+=`<div class="adjustment chan"><div class="head">CHANNELING DETECTED</div><div class="why">${state.adjustment.diagnosis}<br><br>${state.adjustment.action}</div></div>`;
    } else if (state.adjustment.type==="no-change") {
      html+=`<div class="adjustment"><div class="head">NO CLEAR DIRECTION</div><div class="why">${state.adjustment.diagnosis}<br><br>${state.adjustment.action||""}</div></div>`;
    } else if (state.adjustment.type==="adjustment") {
      const adj=state.adjustment.adjustment;
      html+=`<div class="adjustment"><div class="head">PROPOSED ADJUSTMENT</div>
        <div class="change">Clicks <span class="arrow">${r.clicks}</span><span class="arrow">→</span><span class="new">${adj.clicks}</span>
        ${adj.temp!==null?`<br>Temp <span class="arrow">${r.temp}°C</span><span class="arrow">→</span><span class="new">${adj.temp}°C</span>`:""}</div>
        <div class="why">${state.adjustment.diagnosis}</div></div>`;
    }
  }

  if (state.aiAdjustment) {
    if (state.aiAdjustment.ok) {
      const showTemp=state.aiAdjustment.temp!=null&&state.aiAdjustment.temp!==r.temp;
      const showPour=state.aiAdjustment.pourStyle!=null&&state.aiAdjustment.pourStyle!==r.pourStyle;
      html+=`<div class="adjustment ai-adj"><div class="head">AI ADVISOR · ${state.aiAdjustment.confidence.toUpperCase()}</div>
        <div class="change">Clicks <span class="arrow">${r.clicks}</span><span class="arrow">→</span><span class="new">${state.aiAdjustment.clicks}</span>
        ${showTemp?`<br>Temp <span class="arrow">${r.temp}°C</span><span class="arrow">→</span><span class="new">${state.aiAdjustment.temp}°C</span>`:""}
        ${showPour?`<br>Pour <span class="arrow">${r.pourStyle}</span><span class="arrow">→</span><span class="new">${state.aiAdjustment.pourStyle}</span>`:""}
        ${state.aiAdjustment.clicks===r.clicks&&!showTemp&&!showPour?`<br><span style="color:var(--text-dim);font-style:italic;">No change — current looks right.</span>`:""}</div>
        <div class="why">${state.aiAdjustment.rationale}</div></div>`;
    } else {
      html+=`<div class="adjustment chan"><div class="head">AI ERROR</div><div class="why">${state.aiAdjustment.error}</div></div>`;
    }
  }

  html+=`<button class="dev-note-toggle${state.pendingDevNote?" open":""}" id="dev-toggle">field note</button>
    <div class="dev-note-area${state.pendingDevNote?" open":""}" id="dev-area">
      <textarea id="dev-note-input" placeholder="What surprised you? Was the engine off? Calibration notes..." rows="3">${state.pendingDevNote}</textarea>
    </div></div>`;

  const showAskAI=state.feedback.length>0&&!state.feedback.includes("perfect")&&state.apiKey;
  const applyLabel=state.feedback.includes("perfect")?"LOCK & FILE":(state.aiAdjustment?.ok?"APPLY AI · FILE":"APPLY & FILE");
  html+=`<div class="btn-row" style="margin-top:14px;">
    <button class="btn ghost" id="discard-btn">DISCARD</button>
    <button class="btn primary" id="apply-btn">${applyLabel}</button>
  </div>
  ${showAskAI?`<button class="btn ghost${state.apiKey?" ai-ready":""}" id="ask-ai-btn" style="margin-top:8px;">${state.aiLoading?"◇ COMPILING...":"◇ AI SANITY CHECK"}</button>`:""}
  ${!state.apiKey&&state.feedback.length>0&&!state.feedback.includes("perfect")?`<div class="helper-text" style="margin-top:8px;text-align:center;">Set API key in SYS to enable AI advisor</div>`:""}`;

  card.innerHTML=html; wrap.appendChild(card);

  card.querySelector("#fb-grid").addEventListener("click", e => {
    const fb=e.target.dataset.fb; if (!fb) return;
    state.aiAdjustment=null;
    if (fb==="perfect") { state.feedback=["perfect"]; state.adjustment=null; }
    else {
      state.feedback=state.feedback.filter(f=>f!=="perfect");
      state.feedback.includes(fb)?state.feedback.splice(state.feedback.indexOf(fb),1):state.feedback.push(fb);
      state.adjustment=state.feedback.length?processFeedback({currentRecipe:r,feedback:state.feedback,recipeKey:state.recipeKey}):null;
      if (state.adjustment?.type==="channeling") SoundEngine.denied();
    }
    render();
  });
  const notesRow=card.querySelector("#notes-row");
  if (notesRow) notesRow.addEventListener("click", e => {
    const note=e.target.dataset.note; if (!note) return;
    const cur=state.taggedNotes[note];
    state.taggedNotes[note]=cur==="achieved"?"missed":cur==="missed"?undefined:"achieved"; render();
  });
  card.querySelector("#dev-toggle").addEventListener("click", () => {
    const area=card.querySelector("#dev-area"), tog=card.querySelector("#dev-toggle");
    area.classList.toggle("open"); tog.classList.toggle("open");
    if (area.classList.contains("open")) card.querySelector("#dev-note-input").focus();
  });
  card.querySelector("#dev-note-input").addEventListener("input", e => { state.pendingDevNote=e.target.value; });
  card.querySelector("#discard-btn").addEventListener("click", () => { state.screen="recipe"; render(); });
  card.querySelector("#apply-btn").addEventListener("click", applyFeedback);
  const askBtn=card.querySelector("#ask-ai-btn");
  if (askBtn) askBtn.addEventListener("click", async () => {
    if (state.aiLoading) return;
    state.aiLoading=true; render();
    const fbEntry={settings:{clicks:r.clicks,temp:r.temp},feedback:state.feedback};
    const res=await askAdvisor({bean:state.selectedBean,recipeKey:state.recipeKey,currentRecipe:r,feedbackHistory:[fbEntry],mode:"adjust",apiKey:state.apiKey});
    state.aiLoading=false; state.aiAdjustment=res;
    if (res.ok) { state.engineMeta=state.engineMeta||{}; state.engineMeta.aiInvoked=true; state.engineMeta.aiRationale=res.rationale; }
    else SoundEngine.denied();
    render();
  });
  return wrap;
}

// ==========================================================
// APPLY FEEDBACK — archive write
// ==========================================================
function applyFeedback() {
  const r=state.recipe, bean=state.selectedBean;
  const isPerfect=state.feedback.includes("perfect"), useAI=state.aiAdjustment?.ok;
  let finalClicks=r.clicks, finalTemp=r.temp, finalPourStyle=r.pourStyle, appliedSource=null;

  if (isPerfect)            { appliedSource="locked"; }
  else if (useAI)           { finalClicks=state.aiAdjustment.clicks; finalTemp=state.aiAdjustment.temp!=null?state.aiAdjustment.temp:r.temp; finalPourStyle=state.aiAdjustment.pourStyle!=null?state.aiAdjustment.pourStyle:r.pourStyle; appliedSource="ai"; }
  else if (state.adjustment?.type==="adjustment") { finalClicks=state.adjustment.adjustment.clicks; finalTemp=state.adjustment.adjustment.temp||r.temp; appliedSource="local"; }

  const entry={
    id:"brew-"+Date.now(), date:new Date().toISOString(),
    beanId:bean.id, beanName:bean.name, recipeKey:state.recipeKey,
    dose:state.dose, ratio:state.ratio,
    settings:{clicks:r.clicks,temp:r.temp,pourStyle:r.pourStyle},
    feedback:state.feedback, notes:{...state.taggedNotes},
    adjustment:appliedSource==="ai"?{clicks:finalClicks,temp:finalTemp,pourStyle:finalPourStyle,source:"ai"}:(state.adjustment?.adjustment?{...state.adjustment.adjustment,source:"local"}:null),
    adjustmentApplied:appliedSource==="ai"||appliedSource==="local",
    engineMeta:state.engineMeta,
    aiAdjustment:useAI?{clicks:state.aiAdjustment.clicks,temp:state.aiAdjustment.temp,pourStyle:state.aiAdjustment.pourStyle,rationale:state.aiAdjustment.rationale,confidence:state.aiAdjustment.confidence}:null,
    devNote:state.pendingDevNote||null
  };
  state.history.unshift(entry);
  if (state.history.length>100) state.history.length=100;
  save(KEYS.history, state.history);

  if (isPerfect)            persistBeanRecipe(bean, state.recipeKey, {...r, locked:true});
  else if (appliedSource==="ai")    persistBeanRecipe(bean, state.recipeKey, {...r,clicks:finalClicks,temp:finalTemp,pourStyle:finalPourStyle});
  else if (appliedSource==="local") persistBeanRecipe(bean, state.recipeKey, {...r,clicks:finalClicks,temp:finalTemp});

  state.feedback=[]; state.taggedNotes={}; state.adjustment=null; state.aiAdjustment=null;
  state.pendingDevNote=""; state.recipe=null; state.selectedBean=null; state.brewType=null; state.method=null;

  if (isPerfect) {
    SoundEngine.targetAcquired();
    state.justLockedId=entry.id;
    showAcquiredOverlay(entry.settings, () => { toast("◆ DIALED. PROTOCOL LOCKED."); state.screen="history"; render(); });
  } else {
    if (appliedSource==="ai")     toast(`AI APPLIED: ${finalClicks}c${finalTemp?", "+finalTemp+"°C":""}`);
    else if (appliedSource==="local") toast(`FILED: ${finalClicks}c${finalTemp?", "+finalTemp+"°C":""}`);
    else                              toast("FILED.");
    state.screen="history"; render();
  }
}

function persistBeanRecipe(bean, recipeKey, recipe) {
  const existing=state.customBeans.find(b=>b.id===bean.id);
  if (existing) { existing.recipes=existing.recipes||{}; existing.recipes[recipeKey]=recipe; save(KEYS.beans,state.customBeans); }
  else if (!bean.custom) { const clone=JSON.parse(JSON.stringify(bean)); clone.recipes=clone.recipes||{}; clone.recipes[recipeKey]=recipe; clone.id=bean.id; state.customBeans.push(clone); save(KEYS.beans,state.customBeans); }
  else { bean.recipes=bean.recipes||{}; bean.recipes[recipeKey]=recipe; save(KEYS.beans,state.customBeans); }
}

function allBeansResolved() {
  const customIds=new Set(state.customBeans.map(b=>b.id));
  return [...PRESETS.filter(p=>!customIds.has(p.id)), ...state.customBeans];
}
allBeans=allBeansResolved;

function exportDevLog() {
  const lines=["BREW LAB — VOID.LOG",`Exported: ${new Date().toISOString()}`,`Protocols filed: ${state.history.length}`,"==========================================",""];
  for (const h of state.history) {
    lines.push(`# ${h.beanName} · ${h.recipeKey} · ${fmtDate(h.date)}`);
    lines.push(`Recipe: ${h.dose}g · ${h.settings.clicks} clicks · ${h.settings.temp||"—"}°C · ${h.settings.pourStyle||"—"} · 1:${h.ratio}`);
    if (h.engineMeta) {
      lines.push(`Basis: ${h.engineMeta.basis} (confidence: ${h.engineMeta.confidence})`);
      if (h.engineMeta.reasons?.length) { lines.push("  Reasons:"); h.engineMeta.reasons.forEach(r=>lines.push(`    → ${r}`)); }
      if (h.engineMeta.aiInvoked) lines.push(`  AI rationale: ${h.engineMeta.aiRationale||"—"}`);
    }
    const tagged=Object.entries(h.notes||{}).filter(([,v])=>v);
    if (tagged.length) lines.push(`Tasting notes: ${tagged.map(([k,v])=>`${k}=${v}`).join(", ")}`);
    lines.push(`Feedback: ${h.feedback?.length?h.feedback.join(", "):"—"}`);
    if (h.adjustment) { const src=h.adjustment.source||"local"; lines.push(`Adjustment applied (${src}): ${h.adjustment.clicks} clicks${h.adjustment.temp?", "+h.adjustment.temp+"°C":""}${h.adjustment.pourStyle?", "+h.adjustment.pourStyle:""}`); }
    if (h.aiAdjustment) { lines.push(`AI adjustment: ${h.aiAdjustment.clicks}c, ${h.aiAdjustment.temp}°C, ${h.aiAdjustment.pourStyle} (${h.aiAdjustment.confidence})`); lines.push(`  AI rationale: ${h.aiAdjustment.rationale}`); }
    if (h.devNote) lines.push(`FIELD NOTE: ${h.devNote}`);
    lines.push("");
  }
  const text=lines.join("\n");
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(()=>toast("VOID.LOG EXPORTED"),()=>fallbackCopy(text)); }
  else fallbackCopy(text);
}

function fallbackCopy(text) {
  const ta=document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("VOID.LOG EXPORTED"); } catch { toast("Copy failed — try again"); }
  document.body.removeChild(ta);
}

        <div class="ds-row"><span class="ds-key">Custom Beans Logged</span><span class="ds-val">${state.customBeans.length}</span></div>
        <div class="ds-row"><span class="ds-key">Last Incursion</span><span class="ds-val" style="font-size:11px;">${lastDate}</span></div>
      </div>

      <div class="duke-fieldnote">
        Once you've tasted a perfect extraction, mediocre coffee becomes an act of war. Drink accordingly.
      </div>
    </div>

    <button class="btn primary" id="duke-return" style="margin-top:4px;">◀ RETURN TO STATION</button>
    <div class="duke-credits">// dedicated to the creatures of the night</div>
  `;

  wrap.querySelector("#duke-quote").addEventListener("click", () => {
    SoundEngine.tap();
    let n; do { n = Math.floor(Math.random() * DUKE_QUOTES.length); } while (n === state.dukeQuoteIdx);
    state.dukeQuoteIdx = n; render();
  });
  wrap.querySelector("#duke-return").addEventListener("click", () => {
    SoundEngine.tap(); state.screen = "home"; render();
  });
  return wrap;
}

// ==========================================================
// VERSION TAP — 5 taps = VOID.LOG export
// ==========================================================
function onVersionTap() {
  state.versionTapCount++;
  if (state.versionTapCount>=5) { state.versionTapCount=0; exportDevLog(); }
  setTimeout(()=>{ state.versionTapCount=0; }, 2000);
}

// ==========================================================
// BOOT — V3.8
// ==========================================================
// unlock AudioContext on first user gesture (iOS Safari)
["pointerdown","touchstart"].forEach(ev =>
  window.addEventListener(ev, () => SoundEngine.unlock(), { once:true, passive:true })
);
// universal tap sound — capture phase fires before target handlers
document.addEventListener("click", e => {
  if (e.target.closest(".btn, .chip, .tab, .three-toggle button, .note-chip")) SoundEngine.tap();
}, true);

applyCrtMode();
SoundEngine.boot(); // queued until first gesture unlocks AudioContext
bootSequence(render);
</script>
</body>
</html>
